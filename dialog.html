<!-- 通用深色对话框:替代原生 MessageBox,支持类型图标/多按钮/Enter=默认/Esc=取消 -->
<!-- 无 landmark 是有意为之(X4-3 豁免):.win 已是 role="dialog" + aria-modal + 焦点陷阱,
     读屏器进入模态即播报并锁定其中;再嵌 <main> 属结构性冗余。menu.html 同理豁免。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>DSH</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<script src="ui-icons.js"></script>
<script src="ui-kit.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; background: transparent; user-select: none;
    font: var(--font-ui); }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-5) var(--sp-5) var(--sp-4); }
  .top { display: flex; align-items: flex-start; gap: var(--sp-3); min-height: 0;
    -webkit-app-region: drag; } /* 无边框窗口需拖动区(与其他窗口一致);消息/详情显式 no-drag 保住文本选择 */
  .big { -webkit-app-region: no-drag; } /* 配色/尺寸走 ui.css 公共 .big.<type>;拖动语义为本页增量 */
  .txt { display: flex; flex-direction: column; gap: var(--sp-2); padding-top: 2px; min-width: 0; min-height: 0; }
  /* 三级排版走 ui.css 字号/行距令牌(title 15/1.4 → message 13/1.6 → detail 12/1.55),
     行距随层级递减、字号递减:标题紧凑、正文舒展,长文可读性优先 */
  .title { font-size: var(--fs-title); font-weight: 600; color: var(--c-fg0); line-height: var(--lh-title); }
  .message { font-size: var(--fs-body); color: var(--c-fg1); line-height: var(--lh-body); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text;
    -webkit-app-region: no-drag; }
  /* 详情降为「附属材料」:独立下沉面板 + 次级色,与正文形成层级差(原与正文同为裸文本,仅靠字号区分)。
     深澜:左缘 3px 语义色线(信息=澜光/警告=珊瑚/错误=赤潮),色弱下也可辨类型 */
  .detail { font-size: var(--fs-ctrl); color: var(--c-fg2); line-height: var(--lh-ctrl); white-space: pre-wrap; overflow-wrap: anywhere;
    background: color-mix(in srgb, var(--c-bg1) 70%, transparent); border: 1px solid var(--c-hairline);
    border-left: 3px solid var(--c-brand-hi);
    border-radius: var(--radius-m); padding: var(--sp-2) var(--sp-3);
    max-height: 140px; min-height: 0; overflow-y: auto; user-select: text; -webkit-app-region: no-drag; }
  .detail.info { border-left-color: var(--c-brand-hi); }
  .detail.success { border-left-color: var(--c-ok); }
  .detail.warning { border-left-color: var(--c-warn); }
  .detail.error { border-left-color: var(--c-err); }
  .foot { flex: none; display: flex; justify-content: flex-end; gap: var(--sp-2); padding: 2px var(--sp-5) 18px; }
  /* Win11 Acrylic:材质样式在 ui.css §5(窗口外壳层),本页只加类名 */
</style>
</head>
<body>
<div class="win" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="message detail">
  <div class="body">
    <div class="top">
      <div class="big info" id="big" aria-hidden="true"></div>
      <div class="txt">
        <div class="title" id="title"></div>
        <div class="message" id="message"></div>
        <div class="detail" id="detail"></div>
      </div>
    </div>
  </div>
  <div class="foot btn-row" id="foot"></div>
</div>
<script>
  const D = window.__dialog;
  // 图标与复合构件走共享层:结果图标 ui-icons.js,按钮行/结果圆标/聚焦/焦点陷阱 ui-kit.js
  const ICONS = window.UI_ICONS.result;
  const K = window.UI_KIT;
  let payload = null;

  // 焦点陷阱(阶段 0 修复 X3):主进程已补 modal:true 阻断主窗输入,此处收口窗口内焦点,
  // 防止 Tab 跑到窗口外或落到不可见元素。窗口为隐藏复用,陷阱随页面生命周期只装一次即可
  // (每次查询都是实时选择器,不持有节点引用)。
  // 返回的解除闭包保存并在页面卸载时释放(X-7):页面将来若被 reload,监听不残留
  const releaseTrap = K.focusTrap(document.querySelector('.win'));
  window.addEventListener('beforeunload', () => releaseTrap());

  function render(p) {
    payload = p;
    document.title = p.title || 'DSH';
    if (p.acrylic) document.querySelector('.win')?.classList.add('acrylic'); // Win11 材质透出(v0.6.1)
    const type = p.type || 'info';
    // 类型配色走 ui.css 公共 .big.<type>(与状态窗结果视图同一套);
    // 警告/错误按 APG 升格为 alertdialog(读屏即时播报,区别于普通 dialog)
    document.querySelector('.win')?.setAttribute('role', (type === 'warning' || type === 'error') ? 'alertdialog' : 'dialog');
    K.bigBadge(document.getElementById('big'), type, ICONS);
    document.getElementById('title').textContent = p.title || '';
    document.getElementById('message').textContent = p.message || '';
    const det = document.getElementById('detail');
    det.className = 'detail ' + type; // 深澜:detail 面板左缘色线随类型
    det.textContent = p.detail || '';
    det.style.display = p.detail ? '' : 'none';
    const foot = document.getElementById('foot');
    // 按钮行走共享构件(原为 dialog/status/report 三份同构实现中的一份)。
    // 回传「下标 + 按钮 id」:主进程按 id 分发语义(下标会随按钮排列漂移,不可作为契约)
    K.buttonRow(foot, p.buttons || [], (b, i) => D.choose(i, b.id || null));
    // 打开即聚焦主按钮:键盘用户 Enter 直达,无需先 Tab(与状态窗结果视图行为一致,P0-7)
    K.focusPrimary(foot, { delay: 0 });
    // 队列换页(DLG-4):窗口复用(hide/show)时 .win 入场动画只在页面首次加载跑过一次,
    // 重触发一次让接续展示的对话框有入场反馈;prefers-reduced-motion 下 ui.css 已全局禁用动画
    const win = document.querySelector('.win');
    win.style.animation = 'none';
    void win.offsetWidth; // 强制回流后清空,动画从头播放
    win.style.animation = '';
    D.rendered(); // 渲染完成回报:主进程按真实内容高度微调窗口(估算只做首帧,P1-1)
  }

  // 回传「下标 + 按钮 id」:主进程按 id 分发语义(下标会随按钮排列漂移,不可作为契约)
  function chooseIdx(i) {
    const el = document.querySelectorAll('#foot button')[i];
    return D.choose(i, (el && el.dataset.id) ? el.dataset.id : null);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' && e.key !== 'Enter') return;
    if (!payload || !payload.buttons || !payload.buttons.length) return; // 载荷未到/无按钮:不拦截
    const btns = Array.from(document.querySelectorAll('#foot button'));
    e.preventDefault();
    if (e.key === 'Enter') {
      // 焦点在某按钮上时激活该按钮;无焦点时回落 primary 按钮(而非盲取第一个,
      // 否则「取消」被标为 primary 时,Enter 会意外触发确认型首按钮)
      const focused = btns.indexOf(document.activeElement);
      const primary = btns.findIndex((b2) => b2.classList.contains('primary'));
      chooseIdx(focused >= 0 ? focused : (primary >= 0 ? primary : 0));
    } else {
      // Esc = 取消:优先走按钮上显式声明的 cancel 下标,否则回落为最后一个按钮
      const cancel = payload.cancel != null ? payload.cancel : btns.length - 1;
      chooseIdx(cancel);
    }
  });
  D.onShow(render);
</script>
</body>
</html>
