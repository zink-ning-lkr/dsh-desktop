<!-- 通用深色对话框:替代原生 MessageBox,支持类型图标/多按钮/Enter=默认/Esc=取消 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>DSH</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: transparent; user-select: none;
    font: 13px/1 "Segoe UI", "Microsoft YaHei", sans-serif; }
  .win {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: rgba(22, 27, 34, .98);
    border: 1px solid #30363d; border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
    animation: winIn .2s cubic-bezier(.2, .9, .3, 1.15);
  }
  @keyframes winIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  .body { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 18px 20px 14px; }
  .top { display: flex; align-items: flex-start; gap: 12px; }
  .big {
    width: 40px; height: 40px; flex: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .big svg { width: 21px; height: 21px; }
  .info .big { background: rgba(121, 184, 255, .12); color: #79b8ff; }
  .success .big { background: rgba(63, 185, 80, .14); color: #3fb950; animation: pop .34s cubic-bezier(.2, 1.6, .4, 1); }
  .warning .big { background: rgba(210, 153, 34, .14); color: #d29922; }
  .error .big { background: rgba(248, 81, 73, .14); color: #f85149; animation: shake .34s ease; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .txt { display: flex; flex-direction: column; gap: 8px; padding-top: 2px; }
  .title { font-size: 15px; font-weight: 600; color: #e6edf3; line-height: 1.3; }
  .message { font-size: 13px; color: #c9d1d9; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .detail { font-size: 12px; color: #8b949e; line-height: 1.5; white-space: pre-wrap; word-break: break-all;
    max-height: 96px; overflow: hidden; }
  .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 4px 20px 16px; }
  .foot button {
    border: 1px solid #30363d; background: #21262d; color: #c9d1d9; padding: 7px 18px; border-radius: 7px;
    font-size: 12px; cursor: default; transition: background .15s, border-color .15s, transform .08s;
  }
  .foot button:hover { background: #30363d; border-color: #3d444d; }
  .foot button:active { transform: scale(.97); }
  .foot button.primary { background: linear-gradient(180deg, #4d6bfe, #3b5bdb); border-color: transparent; color: #fff; }
  .foot button.primary:hover { filter: brightness(1.12); }
  @media (prefers-reduced-motion: reduce) { .win, .big { animation: none; } }
</style>
</head>
<body>
<div class="win">
  <div class="body">
    <div class="top">
      <div class="big" id="big"></div>
      <div class="txt">
        <div class="title" id="title"></div>
        <div class="message" id="message"></div>
        <div class="detail" id="detail"></div>
      </div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>
<script>
  const D = window.__dialog;
  const ICONS = {
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.2" stroke-linecap="round"/></svg>',
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.7 2.7L16 9.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    warning: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4.5 22 20H2z"/><path d="M12 10v4.5M12 17.4v.2" stroke-linecap="round"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6" stroke-linecap="round"/></svg>',
  };
  let payload = null;

  function render(p) {
    payload = p;
    document.title = p.title || 'DSH';
    const type = p.type || 'info';
    document.querySelector('.win').className = 'win ' + type;
    document.getElementById('big').innerHTML = ICONS[type] || ICONS.info;
    document.getElementById('title').textContent = p.title || '';
    document.getElementById('message').textContent = p.message || '';
    document.getElementById('detail').textContent = p.detail || '';
    document.getElementById('detail').style.display = p.detail ? '' : 'none';
    const foot = document.getElementById('foot');
    foot.innerHTML = '';
    (p.buttons || []).forEach((b, i) => {
      const el = document.createElement('button');
      el.textContent = b.label;
      if (b.primary) el.className = 'primary';
      el.addEventListener('click', () => D.choose(i));
      foot.appendChild(el);
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' && e.key !== 'Enter') return;
    e.preventDefault();
    if (e.key === 'Escape') D.choose(payload && payload.buttons ? payload.buttons.length - 1 : 0);
    else {
      const btns = document.querySelectorAll('#foot button');
      D.choose(0); // 默认键为第一个按钮
    }
  });
  D.onShow(render);
</script>
</body>
</html>
