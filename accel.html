<!-- 下载加速设置窗:多线程分段数滑杆 / 镜像源输入 / npm 镜像指引,改动即时保存到 config.json -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>下载加速设置</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; background: transparent; user-select: none;
    font: var(--font-ui); }
  /* 头部/关闭按钮走 ui.css 公共 .win-head/.win-close(✕ 悬停统一规范红);
     仅覆写本页图标尺寸与品牌色 */
  .win-head .ico { width: 18px; height: 18px; color: var(--c-brand); }
  .win-head .ico svg { width: 17px; height: 17px; }
  .content { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 14px; }
  .sec { display: flex; flex-direction: column; gap: 9px; }
  .sec-t { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--c-fg0); }
  .sec-t .tag {
    font-size: 10px; font-weight: 500; color: var(--c-brand-hi); background: color-mix(in srgb, var(--c-brand-hi) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--c-brand-hi) 25%, transparent); border-radius: 999px; padding: 2px 8px; letter-spacing: .02em;
  }
  .hint { font-size: 12px; color: var(--c-fg2); line-height: 1.55; }
  .hint code { background: var(--c-bg1); border: 1px solid var(--c-bg2); border-radius: 4px; padding: 1px 5px; font-size: 11.5px; color: var(--c-fg1); }
  .dl-note {
    font-size: 12px; color: var(--c-warn); background: color-mix(in srgb, var(--c-warn) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--c-warn) 30%, transparent); border-radius: var(--radius-m); padding: 7px 10px; line-height: 1.5;
  }
  .seg-row { display: flex; align-items: center; gap: 14px; }
  input[type=range] { flex: 1; accent-color: var(--c-brand); height: 4px; cursor: default; }
  .seg-n {
    flex: none; min-width: 58px; text-align: center; font-size: 13px; font-weight: 600; color: var(--c-fg0);
    background: var(--c-bg2); border: 1px solid var(--c-border); border-radius: var(--radius-m); padding: 6px 0;
  }
  .seg-n b { color: var(--c-brand-hi); }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .grow { flex: 1; }
  input[type=text] {
    flex: 1; min-width: 0; background: var(--c-bg0); border: 1px solid var(--c-border); border-radius: var(--radius-m);
    color: var(--c-fg0); font-size: 12.5px; padding: 8px 10px; outline: none; user-select: text;
    font-family: "Cascadia Mono", Consolas, "Microsoft YaHei", monospace;
    transition: border-color var(--dur-mid);
  }
  input[type=text]:focus { border-color: var(--c-brand); }
  input[type=text]::placeholder { color: var(--c-placeholder); }
  .err { min-height: 0; font-size: 11.5px; color: var(--c-err); line-height: 1.4; }
  .cmd {
    display: flex; align-items: center; gap: 8px; background: var(--c-bg0); border: 1px solid var(--c-bg2); border-radius: var(--radius-m);
    padding: 9px 11px; font: 11.5px/1.5 var(--font-mono); color: var(--c-brand-hi);
    word-break: break-all; user-select: text;
  }
  /* Win11 Mica(v0.6.1):系统材质透出——底色半透明、去自绘大阴影 */
  .win.mica { --win-bg: color-mix(in srgb, var(--c-win-bg) 62%, transparent); --win-shadow: none; }
  .foot { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 20px 14px; border-top: 1px solid var(--c-bg2); }
  .foot .note { flex: 1; min-width: 0; font-size: 11px; color: var(--c-fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot .note code { color: var(--c-fg2); }
  /* 就地反馈走 ui.css 公共 .inline-feedback(与 report 窗同一套,样式/配色单一来源) */
</style>
</head>
<body>
<div class="win">
  <div class="win-head">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v10M7.5 10.5 12 15l4.5-4.5M4.5 19.5h15" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="t" id="headTitle"></span>
    <button class="win-close" id="xBtn" title="" aria-label=""><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>

  <div class="content">
    <!-- ① 多线程分段下载(桌面端更新) -->
    <div class="sec">
      <div class="sec-t"><span id="segTitle"></span><span class="tag" id="tagDesktop"></span></div>
      <div class="seg-row">
        <input type="range" id="seg" min="2" max="16" step="1">
        <span class="seg-n"><span id="segPre"></span> <b id="segN">6</b> <span id="segSuf"></span></span>
      </div>
      <div class="hint" id="segHint"></div>
      <div class="dl-note" id="dlNote" style="display:none"></div>
    </div>

    <!-- ② 镜像源(可选,桌面端更新) -->
    <div class="sec">
      <div class="sec-t"><span id="mirrorTitle"></span><span class="tag" id="tagOptional"></span></div>
      <div class="row">
        <input type="text" id="mirror" spellcheck="false">
      </div>
      <div class="row">
        <button class="btn primary" id="mirrorSave"></button>
        <button class="btn danger-ghost" id="mirrorClear"></button>
        <span class="err" id="mirrorErr" aria-live="polite"></span>
      </div>
      <div class="hint" id="mirrorHint"></div>
    </div>

    <!-- ③ dsh 本体更新加速(npm) -->
    <div class="sec">
      <div class="sec-t"><span id="npmTitle"></span><span class="tag" id="tagNpm"></span></div>
      <div class="hint" id="npmHint"></div>
      <div class="cmd" id="npmCmd"></div>
      <div class="row">
        <button class="btn" id="npmCopy"></button>
        <span class="hint" id="npmAfter"></span>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="note"><span id="saveNote"></span><code id="cfgPath">config.json</code></span>
    <span class="inline-feedback" id="toast"></span>
  </div>
</div>
<script>
  const A = window.__accel;
  // 文案表(X-2 第二批):渲染层 t();segHint/mirrorHint 值为仓库内受控文案(仅含 <strong> 标签),用 innerHTML
  const T = (k, p) => window.__i18n.t(k, p);
  {
    const set = (id, k) => { const el = document.getElementById(id); if (el) el.textContent = T(k); };
    set('headTitle', 'accel.title');
    set('segTitle', 'accel.segTitle');
    set('tagDesktop', 'accel.tagDesktop');
    set('segPre', 'accel.segPre');
    set('segSuf', 'accel.segSuf');
    set('dlNote', 'accel.dlNote');
    set('mirrorTitle', 'accel.mirrorTitle');
    set('tagOptional', 'accel.tagOptional');
    set('mirrorSave', 'accel.save');
    set('mirrorClear', 'accel.clear');
    set('npmTitle', 'accel.npmTitle');
    set('tagNpm', 'accel.tagNpm');
    set('npmHint', 'accel.npmHint');
    set('npmCmd', 'accel.npmCmd');
    set('npmCopy', 'accel.copyCmd');
    set('npmAfter', 'accel.npmAfter');
    set('saveNote', 'accel.saveNote');
    document.getElementById('segHint').innerHTML = T('accel.segHint');
    document.getElementById('mirrorHint').innerHTML = T('accel.mirrorHint');
    document.getElementById('seg').setAttribute('aria-label', T('accel.segAria'));
    const mirrorEl = document.getElementById('mirror');
    mirrorEl.placeholder = T('accel.mirrorPlaceholder');
    mirrorEl.setAttribute('aria-label', T('accel.mirrorAria'));
    const xEl = document.getElementById('xBtn');
    xEl.title = T('common.close');
    xEl.setAttribute('aria-label', T('common.close'));
  }
  let cur = null;
  let toastTimer = null;

  function toast(msg, ok) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'inline-feedback ' + (ok ? '' : 'bad ') + 'on';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'inline-feedback'; }, 2600);
  }

  const seg = document.getElementById('seg');
  const segN = document.getElementById('segN');
  const mirror = document.getElementById('mirror');
  const mirrorErr = document.getElementById('mirrorErr');

  function apply(p) {
    cur = p;
    if (p.mica) document.querySelector('.win')?.classList.add('mica'); // Win11 材质透出(v0.6.1)
    seg.value = p.segments;
    setSegText(p.segments);
    mirror.value = p.downloadMirror || '';
    mirrorErr.textContent = '';
    document.getElementById('cfgPath').textContent = p.cfgPath || 'config.json';
    // 下载进行中打开设置窗:提示新设置只对下次下载生效,避免误以为能加速当前下载
    document.getElementById('dlNote').style.display = p.downloadActive ? '' : 'none';
  }

  // 滑杆:拖动实时预览数值,松手保存;读屏经 aria-valuetext 播报「N 段」(值本身只是裸数字)
  function setSegText(n) {
    segN.textContent = n;
    seg.setAttribute('aria-valuetext', T('accel.segAriaVal', { n }));
  }
  seg.addEventListener('input', () => setSegText(seg.value));
  seg.addEventListener('change', async () => {
    const r = await A.set('segments', seg.value);
    if (r.ok) { setSegText(r.value); toast(T('accel.toastSeg', { n: r.value }), true); }
    else { seg.value = cur ? cur.segments : 6; setSegText(seg.value); toast(r.error, false); }
  });

  async function saveMirror() {
    const v = mirror.value.trim();
    const r = await A.set('mirror', v);
    if (r.ok) {
      mirror.value = r.value;
      mirrorErr.textContent = '';
      toast(r.value ? T('accel.toastMirrorSaved') : T('accel.toastReset'), true);
    } else {
      // 错误只在字段级就地呈现(ACC-2,配合 aria-live 播报);底部 toast 只报成功/状态
      mirrorErr.textContent = r.error;
    }
  }
  document.getElementById('mirrorSave').addEventListener('click', saveMirror);
  document.getElementById('mirrorClear').addEventListener('click', async () => {
    const r = await A.set('mirror', '');
    if (r.ok) { mirror.value = ''; mirrorErr.textContent = ''; toast(T('accel.toastReset'), true); }
    else mirrorErr.textContent = r.error; // 清除失败(写入被拒)同样就地呈现,不再静默
  });
  mirror.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveMirror(); });

  document.getElementById('npmCopy').addEventListener('click', () => {
    A.copy(document.getElementById('npmCmd').textContent);
    toast(T('accel.toastCopied'), true);
  });

  // 关闭护栏(ACC-3):分段数即时保存,镜像却需显式保存——直接关窗会静默丢弃已输入的
  // 合法地址(60s 回收后下次打开按 config 回填)。关闭前有未保存变更时:合法则自动落盘后关闭,
  // 校验失败则留在窗口聚焦输入框修正(或清空后关闭),与「改动即时保存」的窗内承诺一致
  async function closeGuarded() {
    const saved = cur ? String(cur.downloadMirror || '') : '';
    const typed = mirror.value.trim();
    if (typed !== saved) {
      const r = await A.set('mirror', typed);
      if (!r.ok) { mirrorErr.textContent = r.error; mirror.focus(); return; }
    }
    A.close();
  }
  document.getElementById('xBtn').addEventListener('click', closeGuarded);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeGuarded(); });

  A.onShow(apply);
  A.get().then((p) => { if (p) { apply(p); segN.textContent = p.segments; } }).catch(() => {}); // 异常时不改表单,保持默认值
</script>
</body>
</html>
