<!-- 错误报告窗:启动失败/dsh 意外退出时展示分类结论、原因、建议与日志预览,一键导出报告 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>DSH</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<script src="ui-i18n.js"></script>
<script src="ui-kit.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; background: transparent; user-select: none;
    font: var(--font-ui); }
  /* 头部三件套(logo/标题/✕)由 ui-kit.winShell 构造(T-5):结构与接线单一来源。
     logo 走 .win-head .ico img 的 ui.css 公共规格(18px),无需本地尺寸规则 */
  /* Win11 Mica:材质样式在 ui.css §5(窗口外壳层),本页只加类名 */
  .body { flex: 1; display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-1) var(--sp-4) var(--sp-3); min-height: 0; }
  /* 状态横幅(深澜):badge 胶囊 + 结论名合一 —— 渐变底 + 左缘 4px 语义色线。
     boot(启动失败)=赤潮红;exit(进程退出)=珊瑚金(由渲染层按 phase 加 .exit) */
  .cls {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 10px 12px;
    border: 1px solid color-mix(in srgb, var(--c-err) 25%, transparent);
    border-left: 4px solid var(--c-err);
    border-radius: var(--radius-m);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c-err) 10%, transparent), color-mix(in srgb, var(--c-err) 3%, transparent));
  }
  .cls.exit {
    border-color: color-mix(in srgb, var(--c-warn) 28%, transparent);
    border-left-color: var(--c-warn);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c-warn) 10%, transparent), color-mix(in srgb, var(--c-warn) 3%, transparent));
  }
  .badge {
    flex: none; padding: 4px var(--sp-3); border-radius: var(--radius-pill); font-size: var(--fs-ctrl); font-weight: 600; line-height: var(--lh-ctrl);
    background: color-mix(in srgb, var(--c-err) 15%, transparent); color: var(--c-err); border: 1px solid color-mix(in srgb, var(--c-err) 35%, transparent);
  }
  .cls.exit .badge { background: color-mix(in srgb, var(--c-warn) 15%, transparent); color: var(--c-warn); border-color: color-mix(in srgb, var(--c-warn) 35%, transparent); }
  .cls .name { font-size: var(--fs-head); font-weight: 600; line-height: var(--lh-head); color: var(--c-fg0); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 结论块:正文级 13/1.6,下沉底色与窗底分层——它是全窗的第一信息块。
     深澜:左缘 3px 赤潮色线(报告窗即错误场景) */
  .cause { font-size: var(--fs-body); color: var(--c-fg1); line-height: var(--lh-body); background: var(--c-bg1); border: 1px solid var(--c-bg2);
    border-left: 3px solid var(--c-err);
    border-radius: var(--radius-m); padding: 10px var(--sp-3); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 88px; overflow-y: auto; user-select: text; }
  /* .sec-label 走 ui.css 公共规格(原为本地复制的一份) */
  .advice { display: flex; flex-direction: column; gap: var(--sp-2); }
  .advice .row { display: flex; gap: var(--sp-2); align-items: flex-start; font-size: var(--fs-body); color: var(--c-fg2); line-height: var(--lh-body); }
  /* 深澜:建议项前置 6px 澜光圆点 + 光晕(替代文本 •) */
  .advice .row::before {
    content: ""; flex: none;
    width: 6px; height: 6px; margin-top: 7px;
    border-radius: 50%;
    background: var(--c-brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-brand) 18%, transparent);
  }
  .log-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp-1); }
  /* 日志区头部(阶段 3 S4-RPT-3):sec-label 居左、计数居中、错误筛选 toggle 居右
     —— 把「行号 / 仅错误行 / 命中数」三个辅助件与日志本身同处一束,避免挤脚区破坏 RPT-1 */
  .log-head { display: flex; align-items: center; gap: var(--sp-2); }
  .log-head .sec-label { margin: 0; }
  .log-meta { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--c-fg2); font-variant-numeric: tabular-nums; }
  .log-head .spacer { flex: 1; }
  /* toggle:幽灵文字钮(深澜),aria-pressed=true 时切澜光描边 + 澜光文字(文案即状态,色弱无碍) */
  .log-toggle { min-height: var(--ctl-h-sm); }
  .log-toggle[aria-pressed="true"] { border-color: var(--c-brand); color: var(--c-brand); }
  .log {
    flex: 1; min-height: 0; overflow: auto; background: var(--c-bg0); border: 1px solid var(--c-bg2); border-radius: var(--radius-m);
    padding: 10px var(--sp-3); font: var(--fs-ctrl)/1.6 var(--font-mono); color: var(--c-fg2);
    white-space: pre-wrap; word-break: break-all; user-select: text;
  }
  /* 行级视觉(阶段 3 S4-RPT-3):每行包一层 .line 便于 toggle 过滤;
     行号 .lnum 4 位右对齐 tabular-nums,保证多行对齐不随数字位数抖动;
     错误 / 警告行用主题色 + 左侧细线强调(色弱友好) */
  .log .line { display: block; }
  .log .line .lnum { display: inline-block; width: 4ch; margin-right: var(--sp-2); color: var(--c-fg3); text-align: right; font-variant-numeric: tabular-nums; user-select: none; }
  .log .line.err { color: var(--c-err); border-left: 2px solid color-mix(in srgb, var(--c-err) 60%, transparent); padding-left: calc(var(--sp-2) - 2px); margin-left: calc(var(--sp-2) * -1); }
  .log .line.warn { color: var(--c-warn); border-left: 2px solid color-mix(in srgb, var(--c-warn) 60%, transparent); padding-left: calc(var(--sp-2) - 2px); margin-left: calc(var(--sp-2) * -1); }
  /* 仅错误模式下,非错误行整个 .line 折叠(而不是隐藏 DOM),保留 grep/复制全文的能力 */
  .log.err-only .line:not(.err) { display: none; }
  /* 脚区与正文之间加一条发丝线:动作/取证工具与上方内容分属两个层级(原无分隔,按钮组在长日志下像正文续行) */
  .foot { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--c-hairline); }
  /* 动作按钮(重试/退出等)必须是独立的 flex 行且不可压缩:
     此前 #actions 是块级容器,报告路径占据空间后其内部 inline 按钮会换行堆叠成竖排,
     与「进程退出」场景的横排布局不一致(几何实测 y=514 与 y=549 两行)。
     位次(RPT-1):动作组居左(主操作/默认焦点位),取证工具组靠右——动线「先修复、后取证」;
     导出报告是取证动作不是流程终点,不占用 success 强调色(全窗仅一个 primary) */
  #actions { display: flex; flex: none; align-items: center; gap: var(--sp-2); }
  .foot .spacer { flex: 1; }
  .foot .note { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--c-fg2); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
  /* 就地反馈走 ui.css 公共 .inline-feedback(与 accel 窗同一套,样式/配色单一来源) */
</style>
</head>
<body>
<div class="win" role="main">
  <div class="win-head">
    <!-- 三件套由 ui-kit.winShell 构造(T-5):品牌小图带 data-logo 跟随主题换黑白 -->
  </div>
  <div class="body">
    <div class="cls">
    <span class="badge" id="badge"></span>
    <span class="name" id="name"></span>
    </div>
    <div class="cause" id="cause"></div>
    <div class="advice" id="advice" role="list"></div>
    <div class="log-wrap">
      <div class="log-head">
        <span class="sec-label" id="logLabel"></span>
        <span class="log-meta" id="logMeta" aria-live="polite"></span>
        <span class="spacer"></span>
        <button class="btn ghost log-toggle" id="errOnlyBtn" type="button" aria-pressed="false"></button>
      </div>
      <div class="log" id="log" role="log" aria-labelledby="logLabel"></div>
    </div>
  </div>
  <div class="foot">
    <!-- 复制/导出的结果反馈:读屏要能播报(X-3)。构件只改 className/textContent,加 aria-live 零冲突 -->
    <span class="inline-feedback" id="flash" aria-live="polite"></span>
    <div id="actions" class="btn-row"></div>
    <span class="spacer"></span>
    <span class="note" id="reportPath"></span>
    <button id="logBtn" class="btn" type="button"></button>
    <button id="copyBtn" class="btn" type="button"></button>
    <button id="exportBtn" class="btn" type="button"></button>
  </div>
</div>
<script>
  const R = window.__report;
  // 复合构件走共享层(阶段 0):按钮行 / 就地反馈 / 聚焦主操作
  const K = window.UI_KIT;
  // 文案表(X-2 第二批):渲染层 t(),静态文案 JS 填充
  const T = (k, p) => window.__i18n.t(k, p);
  // 头部三件套(品牌小图 + 标题 + ✕)由 winShell 构造(T-5):结构与接线单一来源。
  // 关闭回调直连主进程 rp:action('_close'),可访问名入表(common.close)
  const shell = K.winShell(document.querySelector('.win-head'), {
    icon: { img: 'assets/whale-white.png', logo: true },
    title: T('report.winTitle'),
    close: T('common.close'),
    onClose: () => R.action('_close'),
  });
  let payload = null;
  document.title = T('report.winTitle');
  document.getElementById('logLabel').textContent = T('report.logLabel');
  document.getElementById('advice').setAttribute('aria-label', T('report.adviceLabel'));
  document.getElementById('copyBtn').textContent = T('report.copy');
  document.getElementById('exportBtn').textContent = T('report.export');
  document.getElementById('logBtn').textContent = T('report.logFile');
  // 错误筛选 toggle(阶段 3 S4-RPT-3):默认显示「仅错误行」按钮文案,按下后切换为「显示全部」
  // —— 让用户在不依赖对比度的前提下也能看出筛选开关状态(文案即状态)
  const errOnlyBtn = document.getElementById('errOnlyBtn');
  errOnlyBtn.textContent = T('report.logOnlyErrors');
  errOnlyBtn.setAttribute('aria-label', T('report.logOnlyErrors'));

  // 行级分类(阶段 3 S4-RPT-3):同一正则跑两次没必要 —— 一次返回类别字符串,
  // 渲染层做 toggle 时再按需 filter,避免拆两次 + 一次样式分配造成的性能漂移
  const LINE_ERR = /(error|err|fail|throw|✕)/i;
  const LINE_WARN = /(warn|warning|⚠)/i;
  function classify(line) {
    if (LINE_ERR.test(line)) return 'err';
    if (LINE_WARN.test(line)) return 'warn';
    return '';
  }
  const logEl = document.getElementById('log');
  const logMeta = document.getElementById('logMeta');
  // 计数 aria-live=polite:筛选状态变化时把「N / M 行」播报给读屏软件
  function updateLogMeta() {
    const all = logEl.children;
    const total = all.length;
    const errs = logEl.querySelectorAll('.line.err').length;
    const on = errOnlyBtn.getAttribute('aria-pressed') === 'true';
    logMeta.textContent = T('report.logMeta', { shown: on ? errs : total, total });
  }
  function renderLog(text) {
    // 空日志用占位文案;trim 后为空(纯空行)也算空,避免渲染「空容器 + N / 0 行」的诡异 UI
    const body = (text || '').replace(/\s+$/, '');
    if (!body) {
      logEl.replaceChildren(document.createTextNode(T('report.noLog')));
      logMeta.textContent = T('report.logMeta', { shown: 0, total: 0 });
      return;
    }
    const lines = body.split(/\r?\n/);
    const frag = document.createDocumentFragment();
    for (let i = 0; i < lines.length; i++) {
      const span = document.createElement('span');
      const cls = classify(lines[i]);
      span.className = cls ? 'line ' + cls : 'line';
      const ln = document.createElement('span');
      ln.className = 'lnum';
      ln.textContent = String(i + 1).padStart(4, '0'); // 4 位 0 填,与 .lnum{width:4ch} 对齐
      span.appendChild(ln);
      span.appendChild(document.createTextNode(lines[i]));
      frag.appendChild(span);
    }
    logEl.replaceChildren(frag);
    updateLogMeta();
  }
  errOnlyBtn.addEventListener('click', () => {
    const on = errOnlyBtn.getAttribute('aria-pressed') !== 'true';
    errOnlyBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    errOnlyBtn.textContent = on ? T('report.logShowAll') : T('report.logOnlyErrors');
    errOnlyBtn.setAttribute('aria-label', errOnlyBtn.textContent);
    logEl.classList.toggle('err-only', on);
    updateLogMeta();
  });

  function render(p) {
    payload = p;
    document.title = p.name || T('report.winTitle');
    if (p.mica) document.querySelector('.win')?.classList.add('mica'); // Win11 系统材质透出(P2-3)
    // 可见头部文案跟随场景:进程退出时不应再显示「启动诊断」(原为静态文本)
    shell.title.textContent = p.phase === 'exit' ? T('report.headExit') : T('report.headBoot');
    // 徽标兜底文案入表(X5):原为三元里的中文字面量,与 report.badgeExit/badgeBoot 同词
    const badge = p.badge || (p.phase === 'exit' ? T('report.badgeExit') : T('report.badgeBoot'));
    document.getElementById('badge').textContent = badge;
    document.getElementById('name').textContent = p.name || '';
    document.getElementById('cause').textContent = p.cause || '';
    // 深澜:状态横幅按阶段着色(启动失败=赤潮 / 进程退出=珊瑚金)
    document.querySelector('.cls')?.classList.toggle('exit', p.phase === 'exit');
    const advice = document.getElementById('advice');
    advice.innerHTML = '';
    (p.suggestions || []).forEach((s) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.setAttribute('role', 'listitem');
      row.textContent = s;
      advice.appendChild(row);
    });
    const logEl = document.getElementById('log');
    renderLog(p.logPreview || T('report.noLog'));
    logEl.scrollTop = 0; // 复用窗口时回到顶部,避免新内容被旧滚动位置裁掉
    const np = document.getElementById('reportPath');
    if (p.reportPath) { np.textContent = p.reportPath; np.title = p.reportPath; } // 直接在底部显示完整保存路径(悬停/可选中复制)
    else np.textContent = '';
    const actions = document.getElementById('actions');
    // 按钮行走共享构件(原为 dialog/status/report 三份同构实现中的一份)。
    // style 契约原样传入:'primary'/'danger'/'success'(RPT-1),ui-kit 内统一归到对应类名
    K.buttonRow(actions, p.actions || [], (a) => R.action(a.id));
    // 打开即聚焦主操作(重试;无动作时回落 ✕):键盘 Enter 直达修复动线(RPT-2)。
    // raf:等一帧布局稳定后再聚焦,避免测量期焦点被重排吞掉(沿用原实现的做法)
    K.focusPrimary(actions, { raf: true, fallback: shell.close });
  }

  function flash(msg) {
    // 就地反馈走共享构件:时长统一为 2200ms(原为本地 1800ms,与 accel 的 2600ms 并存)
    K.feedback(document.getElementById('flash'), msg);
  }

  document.getElementById('exportBtn').addEventListener('click', () => R.export());
  document.getElementById('copyBtn').addEventListener('click', () => R.copy());
  document.getElementById('logBtn').addEventListener('click', () => R.openLog());
  R.onShow(render);
  R.onCopied(() => flash(T('report.copied')));
  R.onExported(() => flash(T('report.exportedFlash')));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') R.action('_close'); });
</script>
</body>
</html>
