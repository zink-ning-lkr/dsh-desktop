<!-- 错误报告窗:启动失败/dsh 意外退出时展示分类结论、原因、建议与日志预览,一键导出报告 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>DSH 错误报告</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; background: transparent; user-select: none;
    font: var(--font-ui); }
  /* 头部/关闭按钮走 ui.css 公共 .win-head/.win-close;圆角归一到公共 10px(原 12px 与其余窗口不一) */
  .win-head .logo { width: 18px; height: 18px; flex: none; }
  .body { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 4px 16px 0; min-height: 0; }
  .cls { display: flex; align-items: center; gap: 10px; }
  .badge {
    flex: none; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: rgba(248, 81, 73, .15); color: var(--c-err); border: 1px solid rgba(248, 81, 73, .35);
  }
  .cls .name { font-size: 14px; font-weight: 600; color: var(--c-fg0); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cause { font-size: 12.5px; color: var(--c-fg1); line-height: 1.55; background: var(--c-bg1); border: 1px solid var(--c-bg2);
    border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all; max-height: 88px; overflow-y: auto; user-select: text; }
  .sec-label { font-size: 11px; font-weight: 600; color: var(--c-fg2); letter-spacing: .06em; }
  .advice { display: flex; flex-direction: column; gap: 6px; }
  .advice .row { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--c-fg2); line-height: 1.5; }
  .advice .row::before { content: "•"; color: var(--c-brand); flex: none; }
  .log-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .log {
    flex: 1; min-height: 0; overflow: auto; background: var(--c-bg0); border: 1px solid var(--c-bg2); border-radius: 8px;
    padding: 10px 12px; font: 11.5px/1.55 "Cascadia Mono", Consolas, monospace; color: var(--c-fg2);
    white-space: pre-wrap; word-break: break-all; user-select: text;
  }
  .foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px 16px; }
  /* 动作按钮(重试/退出等)必须是独立的 flex 行且不可压缩:
     此前 #actions 是块级容器,报告路径占据空间后其内部 inline 按钮会换行堆叠成竖排,
     与「进程退出」场景的横排布局不一致(几何实测 y=514 与 y=549 两行) */
  #actions { display: flex; flex: none; align-items: center; gap: 8px; }
  .foot .spacer { flex: 1; }
  .foot .note { font-size: 11px; color: var(--c-fg2); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
  /* 就地反馈走 ui.css 公共 .inline-feedback(与 accel 窗同一套,样式/配色单一来源) */
</style>
</head>
<body>
<div class="win">
  <div class="win-head">
    <img class="logo" src="assets/whale-white.png" alt="" data-logo>
    <span class="t" id="headTitle">DSH 错误报告 — 启动诊断</span>
    <button class="win-close" id="xBtn" title="关闭" aria-label="关闭"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div class="body">
    <div class="cls">
      <span class="badge" id="badge">启动失败</span>
      <span class="name" id="name"></span>
    </div>
    <div class="cause" id="cause"></div>
    <div class="advice" id="advice" role="list" aria-label="处理建议"></div>
    <div class="log-wrap">
      <span class="sec-label">关键日志预览(完整内容见「日志文件」)</span>
      <div class="log" id="log"></div>
    </div>
  </div>
  <div class="foot">
    <span class="inline-feedback" id="flash"></span>
    <span class="spacer"></span>
    <span class="note" id="reportPath"></span>
    <button id="copyBtn" class="btn">复制报告</button>
    <button id="exportBtn" class="btn success">导出报告</button>
    <button id="logBtn" class="btn">日志文件</button>
    <div id="actions"></div>
  </div>
</div>
<script>
  const R = window.__report;
  let payload = null;

  function render(p) {
    payload = p;
    document.title = p.name || 'DSH 错误报告';
    // 可见头部文案跟随场景:进程退出时不应再显示「启动诊断」(原为静态文本)
    const headEl = document.getElementById('headTitle');
    if (headEl) headEl.textContent = p.phase === 'exit' ? 'DSH 错误报告 — 进程退出' : 'DSH 错误报告 — 启动诊断';
    const badge = p.badge || (p.phase === 'exit' ? '进程退出' : '启动失败');
    document.getElementById('badge').textContent = badge;
    document.getElementById('name').textContent = p.name || '';
    document.getElementById('cause').textContent = p.cause || '';
    const advice = document.getElementById('advice');
    advice.innerHTML = '';
    (p.suggestions || []).forEach((s) => {
      const row = document.createElement('div');
      row.className = 'row';
      row.setAttribute('role', 'listitem');
      row.textContent = s;
      advice.appendChild(row);
    });
    const logEl = document.getElementById('log');
    logEl.textContent = (p.logPreview || '(暂无日志)').trim() || '(暂无日志)';
    logEl.scrollTop = 0; // 复用窗口时回到顶部,避免新内容被旧滚动位置裁掉
    const np = document.getElementById('reportPath');
    if (p.reportPath) { np.textContent = p.reportPath; np.title = p.reportPath; } // 直接在底部显示完整保存路径(悬停/可选中复制)
    else np.textContent = '';
    const actions = document.getElementById('actions');
    actions.innerHTML = '';
    (p.actions || []).forEach((a) => {
      const el = document.createElement('button');
      el.textContent = a.label;
      el.className = 'btn' + (a.style ? ' ' + a.style : '');
      el.addEventListener('click', () => R.action(a.id));
      actions.appendChild(el);
    });
  }

  function flash(msg) {
    const f = document.getElementById('flash');
    f.textContent = msg;
    f.classList.add('on');
    setTimeout(() => f.classList.remove('on'), 1800);
  }

  document.getElementById('xBtn').addEventListener('click', () => R.action('_close'));
  document.getElementById('exportBtn').addEventListener('click', () => R.export());
  document.getElementById('copyBtn').addEventListener('click', () => R.copy());
  document.getElementById('logBtn').addEventListener('click', () => R.openLog());
  R.onShow(render);
  R.onCopied(() => flash('已复制到剪贴板'));
  R.onExported(() => flash('报告已导出'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') R.action('_close'); });
</script>
</body>
</html>
