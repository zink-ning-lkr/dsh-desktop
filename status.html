<!-- 统一状态窗(任务中心 P1-1):单任务时保持旧单视图(像素级兼容);
     多任务并存时渲染任务列表,完成项可折叠进历史;可挂后台(最小化到任务栏),完成时通知 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>DSH</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<script src="ui-icons.js"></script>
<script src="ui-kit.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; background: transparent; user-select: none;
    font: var(--font-ui); }
  /* 头部/关闭按钮走 ui.css 公共 .win-head/.win-close;横向内边距对齐内容列 16px(原 14px 错位 2px) */
  .win-head { --head-pad: 12px 16px 0; }
  .hmbtn {
    -webkit-app-region: no-drag; border: none; border-radius: var(--radius-s); background: transparent;
    color: var(--c-fg2); cursor: default; display: flex; align-items: center; justify-content: center;
    transition: background var(--dur-mid), color var(--dur-mid);
  }
  .hmbtn:hover { background: var(--c-hover); color: var(--c-fg0); }
  #bgBtn { width: 64px; height: 26px; padding: 0 8px; font-size: var(--fs-ctrl); line-height: 1; gap: 5px; }
  #bgBtn svg { width: 12px; height: 12px; }
  .activity { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4) 14px; }
  .detail { font-size: var(--fs-ctrl); color: var(--c-fg2); line-height: var(--lh-body); white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 60px; min-height: 0; overflow-y: auto; user-select: text; }
  /* 进度条样式(.bar/.fill/.fill.indet 及 sheen/indet 关键帧与 reduced-motion 分支)
     已上移至 ui.css §5:进度条现由 ui-kit.js 的共享构件构造,样式必须与构件同源,
     留在页面内联会让别的页面复用构件时画出裸条。类名与取值逐字未改。 */
  .meta { display: flex; justify-content: space-between; font-size: var(--fs-ctrl); line-height: var(--lh-ctrl); color: var(--c-fg2);
    font-variant-numeric: tabular-nums; /* 进度帧 150ms 刷新:数字等宽,零横跳 */ }
  /* -------- 结果视图(单任务) -------- */
  /* 竖向节奏在 186/250 锁定档内重排:内距 12/16(原 14/18)、间隙 10(原 12)、
     rdetail 上限 58(原 62)——腾出的空间用于结果按钮 30px 命中区(原 28),净高度不增 */
  .result { display: none; flex: 1; min-height: 0; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: var(--sp-3) var(--sp-5) var(--sp-4); }
  .result .big { width: 46px; height: 46px; } /* 尺寸覆盖 ui.css 公共 .big(40px),配色仍走 .big.<type> */
  .result .big svg { width: 24px; height: 24px; }
  .rtitle { font-size: var(--fs-title); font-weight: 600; color: var(--c-fg0); text-align: center; line-height: var(--lh-title); }
  .rdetail { font-size: var(--fs-ctrl); color: var(--c-fg2); text-align: center; line-height: var(--lh-body); max-height: 58px; min-height: 0; overflow-y: auto;
    white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  .btns { flex: none; display: flex; gap: var(--sp-2); margin-top: 2px; }
  /* -------- 任务列表(多任务) -------- */
  .tlist { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 6px; padding: var(--sp-2) 10px var(--sp-3); overflow-y: auto; }
  .trow {
    display: flex; gap: var(--sp-3); align-items: flex-start; padding: 10px var(--sp-3);
    border: 1px solid var(--c-border); border-radius: var(--radius-card); background: var(--c-bg1);
    box-shadow: var(--c-elev-1); /* 卡片与窗底分层:列表滚动时行边界可辨 */
    /* 深澜:左缘 4px 状态色带(进行中=澜光,完成按 type 变色)——列表第一眼按色可扫 */
    border-left: 4px solid var(--c-brand);
  }
  .trow.done.info { border-left-color: var(--c-brand-hi); }
  .trow.done.success { border-left-color: var(--c-ok); }
  .trow.done.warning { border-left-color: var(--c-warn); }
  .trow.done.error { border-left-color: var(--c-err); }
  .trow .lico { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--c-brand-hi); }
  .trow .lico svg { width: 18px; height: 18px; }
  .trow.done .lico.info { color: var(--c-brand-hi); }
  .trow.done .lico.success { color: var(--c-ok); }
  .trow.done .lico.warning { color: var(--c-warn); }
  .trow.done .lico.error { color: var(--c-err); }
  .trow .lbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .trow .ltitle { font-size: var(--fs-body); color: var(--c-fg0); font-weight: 600; line-height: var(--lh-title); }
  .trow .ldetail { font-size: var(--fs-ctrl); color: var(--c-fg2); line-height: var(--lh-ctrl); white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 36px; overflow-y: auto; user-select: text; }
  .trow .lbtns { display: flex; gap: 6px; }
  /* 行内小按钮:高度 --ctl-h-sm(26px,原 22),命中区与行内密度折中;不参与决策行 88px 等宽 */
  .trow .lbtns .btn { min-height: var(--ctl-h-sm); padding: 0 10px; font-size: var(--fs-micro); }
  .trow .lx {
    width: 24px; height: 24px; flex: none; border: none; border-radius: var(--radius-s); background: transparent;
    color: var(--c-fg2); cursor: default; display: flex; align-items: center; justify-content: center;
    transition: background var(--dur-mid), color var(--dur-mid);
  }
  .trow .lx:hover { background: var(--c-hover); color: var(--c-fg0); }
  .trow .lx svg { width: 11px; height: 11px; }
  /* 历史折叠行:整行可点,补圆角与悬停底色(原仅文字变色,可点性不可辨)。
     深澜:计数升级为澜光胶囊;右侧新增「清空」小按钮(hist-clear)。
     hist 行本身是 button,不能再嵌 button,故外层包 .hist-row 容器 */
  .hist-row { display: flex; align-items: center; gap: 6px; }
  .hist {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 6px; padding: 6px var(--sp-2); border-radius: var(--radius-s);
    font-size: var(--fs-ctrl); line-height: var(--lh-ctrl); color: var(--c-fg2);
    cursor: default; border: none; background: transparent; width: 100%; text-align: left;
    transition: background var(--dur-mid), color var(--dur-mid);
  }
  .hist:hover { background: color-mix(in srgb, var(--c-fg2) 12%, transparent); color: var(--c-fg1); }
  .hist .tri { width: 8px; height: 8px; flex: none; transition: transform var(--dur-mid); }
  .hist.open .tri { transform: rotate(90deg); }
  .hist span {
    flex: none; padding: 1px 8px; border-radius: var(--radius-pill);
    background: color-mix(in srgb, var(--c-brand-hi) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--c-brand-hi) 30%, transparent);
    color: var(--c-brand-hi); font-size: var(--fs-micro); font-weight: 600; line-height: 1.5;
  }
  .hist-clear {
    flex: none; min-height: 24px; padding: 0 10px;
    border: 1px solid color-mix(in srgb, var(--c-brand-hi) 30%, transparent);
    border-radius: var(--radius-ctl);
    background: transparent; color: var(--c-brand-hi);
    font-family: inherit; font-size: var(--fs-micro); cursor: default;
    transition: background var(--dur-fast) ease, border-color var(--dur-fast) ease;
  }
  .hist-clear:hover { background: color-mix(in srgb, var(--c-brand-hi) 12%, transparent); border-color: color-mix(in srgb, var(--c-brand-hi) 55%, transparent); }
  .hist-clear:active { background: color-mix(in srgb, var(--c-brand-hi) 18%, transparent); }
  /* Win11 Acrylic:材质样式在 ui.css §5(窗口外壳层),本页只加类名 */
  /* 进度条动效的 reduced-motion 分支随样式一并上移至 ui.css */
</style>
</head>
<body>
<div class="win" role="main">
  <div class="win-head" id="head">
    <!-- 三件套(ico/title/✕)由 ui-kit.winShell 构造(T-5):结构与接线单一来源;
         本页只保留「后台」按钮这一特有插槽,winShell 的 beforeClose 参数把它排到 ✕ 之前 -->
    <button class="hmbtn" id="bgBtn" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 12.5V7M8 12.5V3.5M13.5 12.5V7"/></svg><span id="bgLabel"></span>
    </button>
  </div>
  <div class="activity" id="activity">
    <div class="detail" id="detail"></div>
    <!-- #bar 只是插入槽:真正携带 role=progressbar/aria-* 的节点由 ui-kit.progressBar 构造后挂入
         (此前外壳自带 role,导致进度条套进度条的非法嵌套,读屏可能重复播报) -->
    <div class="bar" id="bar"><div class="fill indet" id="fill"></div></div>
    <div class="meta"><span id="pct"></span><span id="size"></span></div>
  </div>
  <div class="result" id="result" role="alertdialog" aria-labelledby="rtitle" aria-describedby="rdetail">
    <div class="big" id="big" aria-hidden="true"></div>
    <div class="rtitle" id="rtitle"></div>
    <div class="rdetail" id="rdetail"></div>
    <div class="btns" id="btns"></div>
  </div>
  <div class="tlist" id="tlist" role="list"></div>
</div>
<script>
  const S = window.__status;
  if (S.env && S.env.acrylic) document.querySelector('.win')?.classList.add('acrylic'); // Win11 材质透出(v0.6.1)
  // 图标走 ui-icons.js 共享层(与 dialog 结果图标同源,P1-2):activity=进行中五态,result=结果四态
  const { activity: ACT, result: RES } = window.UI_ICONS;
  // 复合构件走共享层(阶段 0):按钮行 / 进度条 / 结果圆标 / 聚焦主按钮不再各页自写
  const K = window.UI_KIT;
  // 动态文案走 i18n 文案表(v0.6.0):preload 同步拉取快照,缺失回退 key
  const T = (k, p) => window.__i18n.t(k, p);
  // 「后台」按钮文案/提示入表(ST-3):tooltip 精确到行为(最小化到任务栏,非"dsh 转后台")
  // 头部三件套(ico/title/✕)由 winShell 构造(T-5):结构、初始文案、关闭回调一处落地。
  // 返回句柄供每帧更新 —— title 的 aria-live 是本页特有的增量(进度帧不改文本时无播报)
  const shell = K.winShell(document.getElementById('head'), {
    title: T('status.title'),
    close: T('status.cancelClose'),
    onClose: () => {
      if (listMode) { S.cancelAll(); return; }
      (cur && cur.mode === 'result' ? S.close() : S.cancel());
    },
    beforeClose: [document.getElementById('bgBtn')],
  });
  shell.title.setAttribute('aria-live', 'polite');
  {
    const bg = document.getElementById('bgBtn');
    const tip = T('status.backgroundTip');
    bg.title = tip;
    bg.setAttribute('aria-label', tip);
    document.getElementById('bgLabel').textContent = T('status.background');
    document.getElementById('tlist').setAttribute('aria-label', T('status.listLabel'));
  }
  let cur = null;   // 单任务模式的当前载荷(头部 ✕ 语义判定)
  let listMode = false;
  let histOpen = false;
  let lastViewKey = ''; // 上帧视图键(result/act/list):仅视图切换帧聚焦安全控件,进度帧不打扰焦点
  let lastFitKey = '';  // 上次回报给主进程的行集合指纹:见 renderTasks(P-3,免去每帧跨进程测量)
  // 列表行的 roving tabindex 宿主(阶段 2 X4):让整份列表在 Tab 序里只占一格。
  // Enter 不在这里接管——焦点本就在行内控件上,原生 button 自己完成"主操作";
  // 本层只补两件浏览器不给的事:↑↓/Home/End 的行间移动,以及 Delete 的行级取消/关闭。
  const nav = K.listNav(document.getElementById('tlist'), {
    rowSelector: '.trow',
    onDelete: (row) => {
      const id = row.dataset.taskId;
      if (!id) return false;
      if (row.classList.contains('done')) S.dismiss(id); else S.cancelOne(id);
      return true;
    },
  });
  // listNav 返回 { sync, rows, destroy }:拆除闭包在页面卸载时释放(X-7)——reload 后监听不残留
  window.addEventListener('beforeunload', () => nav.destroy());

  /* -------- 共享语义构件:实现已上移至 ui-kit.js --------
     进度条/按钮行/结果圆标/聚焦主按钮原先是"9 个页面各写一份"中的一份,现统一走 L3 构件;
     本页只保留 status 特有两件事:①容器的类名(单视图 btns btn-row 与列表行 lbtns 密度不同,
     不强行统一,否则像素契约会变);②把任务 id 绑进回调(动作全部携带 taskId 是状态窗的语义)。
     DOM 形态保持不变,UITEST 锁定的 186/250 高度不受影响。 */
  function fmtPct(t, has) {
    return t.pct || (has ? t.progress.toFixed(1) + '%' : (t.spin ? T('status.wait') : ''));
  }
  function fillButtons(container, t, cls) {
    container.className = cls;
    return K.buttonRow(container, t.buttons || [], (b) => S.action(t.id, b.id));
  }

  // 视图打开时聚焦安全默认控件(ST-1):活动/列表视图聚焦「后台」(与 Esc 梯度对齐,Enter=安全离开),
  // bgBtn 不可见(列表仅剩完成项)时回落 ✕;结果视图自带主按钮聚焦,不经过这里
  function focusSafeDefault() {
    const bg = document.getElementById('bgBtn');
    if (bg && bg.style.display !== 'none') { bg.focus(); return; }
    shell.close?.focus();
  }

  /* -------- 单任务视图(与旧版逐行一致,像素级兼容) --------
     P1-3 说明:语义构件已抽为上方共享函数,本函数只保留单视图布局壳——
     结果态大图标居中布局与列表行是两种视觉契约,不强行并入 taskRow;
     新增能力一律先进共享构件,两路径自动同享 */
  function render(p) {
    cur = p;
    document.title = p.title || 'DSH';
    const isRes = p.mode === 'result';
    document.getElementById('activity').style.display = isRes ? 'none' : 'flex';
    // 活动态向读屏声明区域忙(ST-2):高频进度帧不逐条播报,由结果视图 alertdialog 在完成瞬间播报
    document.getElementById('activity').setAttribute('aria-busy', isRes ? 'false' : 'true');
    document.getElementById('result').style.display = isRes ? 'flex' : 'none';
    document.getElementById('tlist').style.display = 'none';
    document.getElementById('bgBtn').style.display = isRes ? 'none' : '';
    shell.ico.innerHTML = isRes ? (RES[p.type || 'info'] || RES.info) : (ACT[p.mode] || ACT.check);
    shell.title.textContent = p.title || '';
    const xTip = isRes ? T('status.close') : T('status.cancelClose');
    shell.close.title = xTip;
    shell.close.setAttribute('aria-label', xTip);
    if (isRes) {
      const type = p.type || 'info';
      document.getElementById('result').className = 'result';
      // 类型配色走 ui.css 公共 .big.<type>(与对话框同一套);构造走 ui-kit 共享构件
      K.bigBadge(document.getElementById('big'), type, RES);
      document.getElementById('rtitle').textContent = p.title || '';
      document.getElementById('rdetail').textContent = p.detail || '';
      fillButtons(document.getElementById('btns'), p, 'btns btn-row');
      // 结果到达即聚焦主按钮:键盘用户 Enter 直达,无需先 Tab 到按钮。
      // guard 传 #result:视图已被下一帧切走时放弃聚焦,不抢焦点(原为 style.display 手判)
      K.focusPrimary(document.getElementById('btns'), { delay: 30, guard: document.getElementById('result') });
      return;
    }
    document.getElementById('detail').textContent = p.detail || '';
    const barWrap = document.getElementById('bar');
    barWrap.innerHTML = '';
    barWrap.appendChild(K.progressBar(p, p.title || T('status.progress')));
    const has = typeof p.progress === 'number';
    document.getElementById('pct').textContent = fmtPct(p, has);
    document.getElementById('size').textContent = p.size || '';
  }

  /* -------- 多任务列表(任务中心) --------
     阶段 2(C3 + X4):行的骨架只建一次,此后每帧只改变化了的字段(keyed diff,见 ui-kit.keyedList),
     行内控件退出 Tab 序、由 listNav 的 roving tabindex 接管(↑↓/Home/End + Enter/Delete)。
     这两件事必须同批落地:全量重建会把行节点整个换掉,任何在此之上的焦点管理都会被冲掉。
     进度文案/按钮行走上方共享构件(fmtPct / fillButtons),本区不再各写一份。 */
  // 只在值真的变了才写 DOM:进度帧 150ms 一次,无脑赋值会每帧重建文本节点
  function setText(node, v) {
    const s = v == null ? '' : String(v);
    if (node && node.textContent !== s) node.textContent = s;
  }

  // 行骨架:一次建好 .lico/.lbody/.ltitle/.lx 四个稳定件,其余(详情/进度条/按钮行)按形态增删
  function buildRow(t) {
    const row = document.createElement('div');
    row.setAttribute('role', 'listitem');
    row.dataset.taskId = t.id;
    const ico = document.createElement('span');
    ico.className = 'lico';
    ico.setAttribute('aria-hidden', 'true');
    const body = document.createElement('div');
    body.className = 'lbody';
    const title = document.createElement('div');
    title.className = 'ltitle';
    body.appendChild(title);
    const x = document.createElement('button');
    x.className = 'lx';
    x.tabIndex = -1; // 退出 Tab 序:整个列表在 Tab 里只占一格(K.listNav 会把其中一个提升为 0)
    // Delete 是本行的取消/关闭加速键:并进 aria-keyshortcuts 让读屏器可程序化发现(X4-4)
    x.setAttribute('aria-keyshortcuts', 'Delete');
    x.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
    // 语义从行本身读,不从建行时的 t 闭包读:节点会被 keyed diff 复用到另一个任务上
    x.addEventListener('click', () => {
      const id = row.dataset.taskId;
      if (row.classList.contains('done')) S.dismiss(id); else S.cancelOne(id);
    });
    row.append(ico, body, x);
    row._st = {};
    return row;
  }

  // 主体下半段(进行中:进度条 + pct/size;已完成:结果按钮行)。只在形态真的变了时重建
  function rebuildFoot(row, t) {
    const body = row.querySelector('.lbody');
    for (const sel of ['.bar', '.meta', '.lbtns']) {
      const old = body.querySelector(sel);
      if (old) old.remove();
    }
    if (!t.done) {
      body.appendChild(K.progressBar(t, t.title || T('status.progress')));
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.append(document.createElement('span'), document.createElement('span'));
      body.appendChild(meta);
      return;
    }
    if ((t.buttons || []).length) {
      const box = K.buttonRow(document.createElement('div'), t.buttons || [], (b) => S.action(row.dataset.taskId, b.id), { cls: 'lbtns' });
      // 行内按钮同样退出 Tab 序(与 .lx 一致):否则 Tab 又要逐行逐个穿行,roving 形同虚设
      box.querySelectorAll('button').forEach((b) => { b.tabIndex = -1; });
      body.appendChild(box);
    }
  }
  // 形态键:完成态 + 按钮集合的指纹。指纹变了才重建,否则进度帧会每帧重造按钮行
  function footKey(t) {
    if (!t.done) return 'active';
    return 'done:' + (t.buttons || []).map((b) => (b.id || '') + '|' + (b.label || '')).join(',');
  }

  function updateRow(row, t) {
    const st = row._st;
    const cls = 'trow' + (t.done ? ' done' : '');
    if (row.className !== cls) row.className = cls;
    const ico = row.querySelector('.lico');
    const icoCls = 'lico' + (t.done ? ' ' + (t.type || 'info') : '');
    if (ico.className !== icoCls) ico.className = icoCls;
    const svg = t.done ? (RES[t.type || 'info'] || RES.info) : (ACT[t.mode] || ACT.check);
    if (st.svg !== svg) { ico.innerHTML = svg; st.svg = svg; }
    setText(row.querySelector('.ltitle'), t.title || '');
    // 详情行:有则改文本,无则移除(不留空节点,行高契约按内容算)
    const detail = t.detail || '';
    if (st.detail !== detail) {
      st.detail = detail;
      let d = row.querySelector('.ldetail');
      if (!detail) { if (d) d.remove(); }
      else {
        if (!d) {
          d = document.createElement('div');
          d.className = 'ldetail';
          const title = row.querySelector('.ltitle');
          title.parentNode.insertBefore(d, title.nextSibling);
        }
        d.textContent = detail;
      }
    }
    const fk = footKey(t);
    if (st.foot !== fk) { st.foot = fk; st.shape = ''; rebuildFoot(row, t); }
    if (!t.done) {
      const has = typeof t.progress === 'number';
      const fill = row.querySelector('.fill');
      if (fill) {
        const fillCls = 'fill' + (has ? '' : ' indet');
        if (fill.className !== fillCls) fill.className = fillCls;
        if (has) {
          const pct = Math.max(0, Math.min(100, t.progress));
          const w = pct + '%';
          if (fill.style.width !== w) fill.style.width = w;
          const v = String(Math.round(pct));
          const bar = fill.parentNode;
          if (bar.getAttribute('aria-valuenow') !== v) bar.setAttribute('aria-valuenow', v);
        } else {
          const bar = fill.parentNode;
          if (bar.hasAttribute('aria-valuenow')) bar.removeAttribute('aria-valuenow');
        }
      }
      const meta = row.querySelector('.meta');
      if (meta) {
        setText(meta.children[0], fmtPct(t, has));
        setText(meta.children[1], t.size || '');
      }
    }
    // ✕ 语义随完成态原地切换(节点被复用到另一个任务上时必须重算)
    const xl = t.done ? T('status.closeRow') : T('status.cancelRow');
    if (st.xl !== xl) {
      st.xl = xl;
      const x = row.querySelector('.lx');
      x.title = xl;
      x.setAttribute('aria-label', xl + (t.title || ''));
    }
  }

  // 列表的期望子节点序列。完成项**恒**住在 #histWrap 里(而不是"没有进行中任务时直接挂列表"):
  // 否则最后一个进行中任务完成的那一帧,该行要从列表搬进折叠区,节点身份断掉、焦点跟着丢。
  function listSpecs(tasks) {
    const act = tasks.filter((t) => !t.done);
    const done = tasks.filter((t) => t.done);
    const specs = act.map((t) => ({ k: 't:' + t.id, kind: 'row', t }));
    if (done.length) {
      if (act.length) specs.push({ k: 'hist', kind: 'hist', n: done.length });
      specs.push({ k: 'w', kind: 'wrap', tasks: done, expanded: !act.length || histOpen });
    }
    return specs;
  }

  function renderList(tasks) {
    cur = null;
    const act = tasks.filter((t) => !t.done);
    document.getElementById('activity').style.display = 'none';
    document.getElementById('activity').setAttribute('aria-busy', 'false');
    document.getElementById('result').style.display = 'none';
    const list = document.getElementById('tlist');
    list.style.display = 'flex';
    shell.ico.innerHTML = ACT.check;
    setText(shell.title, act.length ? T('status.titleActive', { n: act.length }) : T('status.title'));
    document.getElementById('bgBtn').style.display = act.length ? '' : 'none';
    const xTip = T('status.closeAll');
    shell.close.title = xTip;
    shell.close.setAttribute('aria-label', xTip);
    K.keyedList(list, listSpecs(tasks), (spec) => {
      if (spec.kind === 'row') return buildRow(spec.t);
      if (spec.kind === 'hist') {
        // 历史行 = 容器(.hist-row):左侧展开折叠按钮 + 右侧「清空」按钮。
        // button 不能嵌 button,故拆两层;「清空」走 st:clear-done(主进程清掉全部完成项)
        const wrap = document.createElement('div');
        wrap.className = 'hist-row';
        const h = document.createElement('button');
        h.className = 'hist';
        h.setAttribute('aria-controls', 'histWrap');
        // 折叠三角用 SVG(原文本 ▶ 字形随字体渲染漂移):aria-expanded 语义不变
        h.innerHTML = '<svg class="tri" viewBox="0 0 8 8" aria-hidden="true"><path d="M2 1l4 3-4 3" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><span></span>';
        h.addEventListener('click', () => setHist(!histOpen));
        const clear = document.createElement('button');
        clear.className = 'hist-clear';
        clear.textContent = T('status.clearDone');
        clear.addEventListener('click', () => S.clearDone());
        wrap.append(h, clear);
        return wrap;
      }
      const wrap = document.createElement('div');
      wrap.id = 'histWrap';
      return wrap;
    }, (node, spec) => {
      if (spec.kind === 'row') return updateRow(node, spec.t);
      if (spec.kind === 'hist') {
        const h = node.querySelector('.hist');
        h.classList.toggle('open', histOpen);
        h.setAttribute('aria-expanded', histOpen ? 'true' : 'false');
        setText(h.querySelector('span'), T('status.done', { n: spec.n }));
        return;
      }
      node.style.display = spec.expanded ? 'contents' : 'none';
      // 嵌套一层 keyed diff:完成行的进度/文本同样只改变化了的字段
      K.keyedList(node, spec.tasks.map((t) => ({ k: 't:' + t.id, kind: 'row', t })),
        (s) => buildRow(s.t), (n, s) => updateRow(n, s.t));
      return;
    });
    nav.sync(); // 行序每次都会变:重算 roving 的 tabindex 落点(焦点位置从 activeElement 恢复)
  }
  function setHist(open) {
    histOpen = open;
    const w = document.getElementById('histWrap');
    if (w) w.style.display = open ? 'contents' : 'none';
    const h = document.querySelector('#tlist .hist');
    if (h) { h.classList.toggle('open', open); h.setAttribute('aria-expanded', open ? 'true' : 'false'); }
    nav.sync(); // 折叠/展开改变了可见行集合
    S.rendered(); // 展开/折叠改变了列表自然高度,同样要回报一次(不依赖下一帧:进度帧只在行集合变化时才回报)
  }

  function renderTasks(tasks) {
    if (!tasks.length) return; // 主进程随即关窗,忽略空帧
    // 单任务走旧单视图(像素级兼容 186/250 两档),多任务走列表。
    // 阶段 1 X1 起本窗不再兼任 toast 宿主:瞬时提示由独立的通知宿主(toast.html)承载,
    // 因此这里不必再为"孤儿 toast"单开一条列表路径——列表里出现的每一行都是真实任务。
    if (tasks.length === 1) { listMode = false; lastFitKey = ''; render(tasks[0]); }
    else {
      listMode = true;
      renderList(tasks);
      // 渲染完成回报:主进程按真实内容高度微调窗口(P1-1)。
      // 只在「行集合」变化时回报 —— 主进程收到后要 executeJavaScript 注入一段遍历整列表的测量脚本,
      // 而本函数由 150ms 一帧的进度推送驱动,每帧回报等于每秒 7 次跨进程 DOM 测量。
      // 行集合指纹 = 进行中数 + 完成数 + 历史是否展开(三者决定列表的自然高度)。
      const act = tasks.reduce((n, t) => n + (t.done ? 0 : 1), 0);
      const key = act + '|' + (tasks.length - act) + '|' + histOpen;
      if (key !== lastFitKey) { lastFitKey = key; S.rendered(); }
    }
    // 视图切换帧(ST-1):把焦点交给安全默认控件。进度帧 150ms 一次全量重渲染,
    // 必须凭 viewKey 变化判帧,否则焦点被钉死在 bgBtn 上,用户 Tab 不出去
    const viewKey = listMode ? 'list' : (cur && cur.mode === 'result' ? 'result' : 'act');
    if (viewKey !== lastViewKey) {
      lastViewKey = viewKey;
      if (viewKey !== 'result') focusSafeDefault();
    }
  }

  document.getElementById('bgBtn').addEventListener('click', () => S.background());
  // 单任务:活动态 ✕ = 取消并关闭,结果态 ✕ = 仅关闭;多任务列表:✕ = 取消全部未完成任务并关闭
  // (列表关闭不再直接丢弃运行中任务——那会让下载/安装成为不可见且不可取消的孤儿,P0-1)
  // 点击回调已在 winShell 的 onClose 落地(与头部结构同源,T-5)
  // Esc 语义梯度(P1-4):存在进行中任务时 Esc = 挂后台(安全离开,不打断任务);
  // 仅剩结果/历史时 Esc = 关窗。✕ 按钮保持「显式取消」语义——破坏性操作必须是看着 ✕ 的主动行为
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const hasActive = listMode
      ? [...document.querySelectorAll('#tlist .trow:not(.done)')].length > 0
      : !!(cur && cur.mode !== 'result');
    if (hasActive) S.background(); else shell.close.click();
  });
  S.onTasks(renderTasks);
</script>
</body>
</html>
