<!-- 统一状态窗(任务中心 P1-1):单任务时保持旧单视图(像素级兼容);
     多任务并存时渲染任务列表,完成项可折叠进历史;可挂后台(最小化到任务栏),完成时通知 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>DSH</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<script src="ui-icons.js"></script>
<script src="ui-kit.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; background: transparent; user-select: none;
    font: var(--font-ui); }
  /* 头部/关闭按钮走 ui.css 公共 .win-head/.win-close;横向内边距对齐内容列 16px(原 14px 错位 2px) */
  .win-head { --head-pad: 12px 16px 0; }
  .hmbtn {
    -webkit-app-region: no-drag; border: none; border-radius: var(--radius-s); background: transparent;
    color: var(--c-fg2); cursor: default; display: flex; align-items: center; justify-content: center;
    transition: background var(--dur-mid), color var(--dur-mid);
  }
  .hmbtn:hover { background: var(--c-hover); color: var(--c-fg0); }
  #bgBtn { width: 64px; height: 26px; padding: 0 8px; font-size: var(--fs-ctrl); line-height: 1; gap: 5px; }
  #bgBtn svg { width: 12px; height: 12px; }
  .activity { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4) 14px; }
  .detail { font-size: var(--fs-ctrl); color: var(--c-fg2); line-height: var(--lh-body); white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 60px; min-height: 0; overflow-y: auto; user-select: text; }
  /* 进度条样式(.bar/.fill/.fill.indet 及 sheen/indet 关键帧与 reduced-motion 分支)
     已上移至 ui.css §5:进度条现由 ui-kit.js 的共享构件构造,样式必须与构件同源,
     留在页面内联会让别的页面复用构件时画出裸条。类名与取值逐字未改。 */
  .meta { display: flex; justify-content: space-between; font-size: var(--fs-ctrl); line-height: var(--lh-ctrl); color: var(--c-fg2);
    font-variant-numeric: tabular-nums; /* 进度帧 150ms 刷新:数字等宽,零横跳 */ }
  /* -------- 结果视图(单任务) -------- */
  /* 竖向节奏在 186/250 锁定档内重排:内距 12/16(原 14/18)、间隙 10(原 12)、
     rdetail 上限 58(原 62)——腾出的空间用于结果按钮 30px 命中区(原 28),净高度不增 */
  .result { display: none; flex: 1; min-height: 0; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: var(--sp-3) var(--sp-5) var(--sp-4); }
  .result .big { width: 46px; height: 46px; } /* 尺寸覆盖 ui.css 公共 .big(40px),配色仍走 .big.<type> */
  .result .big svg { width: 24px; height: 24px; }
  .rtitle { font-size: var(--fs-title); font-weight: 600; color: var(--c-fg0); text-align: center; line-height: var(--lh-title); }
  .rdetail { font-size: var(--fs-ctrl); color: var(--c-fg2); text-align: center; line-height: var(--lh-body); max-height: 58px; min-height: 0; overflow-y: auto;
    white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  .btns { flex: none; display: flex; gap: var(--sp-2); margin-top: 2px; }
  /* -------- 任务列表(多任务) -------- */
  .tlist { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 6px; padding: var(--sp-2) 10px var(--sp-3); overflow-y: auto; }
  .trow {
    display: flex; gap: var(--sp-3); align-items: flex-start; padding: 10px var(--sp-3);
    border: 1px solid var(--c-border); border-radius: var(--radius-l); background: var(--c-bg1);
    box-shadow: var(--c-elev-1); /* 卡片与窗底分层:列表滚动时行边界可辨 */
  }
  .trow .lico { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--c-brand-hi); }
  .trow .lico svg { width: 18px; height: 18px; }
  .trow.done .lico.info { color: var(--c-brand-hi); }
  .trow.done .lico.success { color: var(--c-ok); }
  .trow.done .lico.warning { color: var(--c-warn); }
  .trow.done .lico.error { color: var(--c-err); }
  .trow .lbody { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .trow .ltitle { font-size: var(--fs-body); color: var(--c-fg0); font-weight: 600; line-height: var(--lh-title); }
  .trow .ldetail { font-size: var(--fs-ctrl); color: var(--c-fg2); line-height: var(--lh-ctrl); white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 36px; overflow-y: auto; user-select: text; }
  .trow .lbtns { display: flex; gap: 6px; }
  /* 行内小按钮:高度 --ctl-h-sm(26px,原 22),命中区与行内密度折中;不参与决策行 88px 等宽 */
  .trow .lbtns .btn { min-height: var(--ctl-h-sm); padding: 0 10px; font-size: var(--fs-micro); }
  .trow .lx {
    width: 24px; height: 24px; flex: none; border: none; border-radius: var(--radius-s); background: transparent;
    color: var(--c-fg2); cursor: default; display: flex; align-items: center; justify-content: center;
    transition: background var(--dur-mid), color var(--dur-mid);
  }
  .trow .lx:hover { background: var(--c-hover); color: var(--c-fg0); }
  .trow .lx svg { width: 11px; height: 11px; }
  /* 历史折叠行:整行可点,补圆角与悬停底色(原仅文字变色,可点性不可辨) */
  .hist {
    display: flex; align-items: center; gap: 6px; padding: 6px var(--sp-2); border-radius: var(--radius-s);
    font-size: var(--fs-ctrl); line-height: var(--lh-ctrl); color: var(--c-fg2);
    cursor: default; border: none; background: transparent; width: 100%; text-align: left;
    transition: background var(--dur-mid), color var(--dur-mid);
  }
  .hist:hover { background: color-mix(in srgb, var(--c-fg2) 12%, transparent); color: var(--c-fg1); }
  .hist .tri { width: 8px; height: 8px; flex: none; transition: transform var(--dur-mid); }
  .hist.open .tri { transform: rotate(90deg); }
  /* Win11 Acrylic(v0.6.1):系统材质透出——底色半透明、去自绘大阴影 */
  .win.acrylic { --win-bg: color-mix(in srgb, var(--c-win-bg) 55%, transparent); --win-shadow: none; }
  /* 进度条动效的 reduced-motion 分支随样式一并上移至 ui.css */
</style>
</head>
<body>
<div class="win" role="main">
  <div class="win-head" id="head">
    <span class="ico" id="ico" aria-hidden="true"></span>
    <span class="t" id="title" aria-live="polite">…</span>
    <button class="hmbtn" id="bgBtn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 12.5V7M8 12.5V3.5M13.5 12.5V7"/></svg><span id="bgLabel"></span>
    </button>
    <button class="win-close" id="xBtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div class="activity" id="activity">
    <div class="detail" id="detail"></div>
    <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="fill indet" id="fill"></div></div>
    <div class="meta"><span id="pct"></span><span id="size"></span></div>
  </div>
  <div class="result" id="result" role="alertdialog" aria-labelledby="rtitle" aria-describedby="rdetail">
    <div class="big" id="big" aria-hidden="true"></div>
    <div class="rtitle" id="rtitle"></div>
    <div class="rdetail" id="rdetail"></div>
    <div class="btns" id="btns"></div>
  </div>
  <div class="tlist" id="tlist" role="list"></div>
</div>
<script>
  const S = window.__status;
  if (S.env && S.env.acrylic) document.querySelector('.win')?.classList.add('acrylic'); // Win11 材质透出(v0.6.1)
  // 图标走 ui-icons.js 共享层(与 dialog 结果图标同源,P1-2):activity=进行中五态,result=结果四态
  const { activity: ACT, result: RES } = window.UI_ICONS;
  // 复合构件走共享层(阶段 0):按钮行 / 进度条 / 结果圆标 / 聚焦主按钮不再各页自写
  const K = window.UI_KIT;
  // 动态文案走 i18n 文案表(v0.6.0):preload 同步拉取快照,缺失回退 key
  const T = (k, p) => window.__i18n.t(k, p);
  // 「后台」按钮文案/提示入表(ST-3):tooltip 精确到行为(最小化到任务栏,非"dsh 转后台")
  // 头部/列表区其余文案也在本块统一入表(阶段 0 收尾 X5):此前 ✕、进度条、任务列表的
  // title/aria-label 以中文字面量写在标签属性里,属渲染层硬编码;xBtn 的两处动态改写
  // (renderHead / 列表模式)仍在原位,此处只保证首帧即有可用标签。
  {
    const bg = document.getElementById('bgBtn');
    const tip = T('status.backgroundTip');
    bg.title = tip;
    bg.setAttribute('aria-label', tip);
    document.getElementById('bgLabel').textContent = T('status.background');
    const x = document.getElementById('xBtn');
    x.title = T('status.cancelClose');
    x.setAttribute('aria-label', T('status.cancelClose'));
    document.getElementById('bar').setAttribute('aria-label', T('status.progress'));
    document.getElementById('tlist').setAttribute('aria-label', T('status.listLabel'));
  }
  let cur = null;   // 单任务模式的当前载荷(头部 ✕ 语义判定)
  let listMode = false;
  let histOpen = false;
  let lastViewKey = ''; // 上帧视图键(result/act/list):仅视图切换帧聚焦安全控件,进度帧不打扰焦点

  /* -------- 共享语义构件:实现已上移至 ui-kit.js --------
     进度条/按钮行/结果圆标/聚焦主按钮原先是"9 个页面各写一份"中的一份,现统一走 L3 构件;
     本页只保留 status 特有两件事:①容器的类名(单视图 btns btn-row 与列表行 lbtns 密度不同,
     不强行统一,否则像素契约会变);②把任务 id 绑进回调(动作全部携带 taskId 是状态窗的语义)。
     DOM 形态保持不变,UITEST 锁定的 186/250 高度不受影响。 */
  function fmtPct(t, has) {
    return t.pct || (has ? t.progress.toFixed(1) + '%' : (t.spin ? T('status.wait') : ''));
  }
  function fillButtons(container, t, cls) {
    container.className = cls;
    return K.buttonRow(container, t.buttons || [], (b) => S.action(t.id, b.id));
  }

  // 视图打开时聚焦安全默认控件(ST-1):活动/列表视图聚焦「后台」(与 Esc 梯度对齐,Enter=安全离开),
  // bgBtn 不可见(列表仅剩完成项)时回落 ✕;结果视图自带主按钮聚焦,不经过这里
  function focusSafeDefault() {
    const bg = document.getElementById('bgBtn');
    if (bg && bg.style.display !== 'none') { bg.focus(); return; }
    document.getElementById('xBtn')?.focus();
  }

  /* -------- 单任务视图(与旧版逐行一致,像素级兼容) --------
     P1-3 说明:语义构件已抽为上方共享函数,本函数只保留单视图布局壳——
     结果态大图标居中布局与列表行是两种视觉契约,不强行并入 taskRow;
     新增能力一律先进共享构件,两路径自动同享 */
  function render(p) {
    cur = p;
    document.title = p.title || 'DSH';
    const isRes = p.mode === 'result';
    document.getElementById('activity').style.display = isRes ? 'none' : 'flex';
    // 活动态向读屏声明区域忙(ST-2):高频进度帧不逐条播报,由结果视图 alertdialog 在完成瞬间播报
    document.getElementById('activity').setAttribute('aria-busy', isRes ? 'false' : 'true');
    document.getElementById('result').style.display = isRes ? 'flex' : 'none';
    document.getElementById('tlist').style.display = 'none';
    document.getElementById('bgBtn').style.display = isRes ? 'none' : '';
    document.getElementById('ico').innerHTML = isRes ? (RES[p.type || 'info'] || RES.info) : (ACT[p.mode] || ACT.check);
    document.getElementById('title').textContent = p.title || '';
    document.getElementById('xBtn').title = isRes ? T('status.close') : T('status.cancelClose');
    document.getElementById('xBtn').setAttribute('aria-label', isRes ? T('status.close') : T('status.cancelClose'));
    if (isRes) {
      const type = p.type || 'info';
      document.getElementById('result').className = 'result';
      // 类型配色走 ui.css 公共 .big.<type>(与对话框同一套);构造走 ui-kit 共享构件
      K.bigBadge(document.getElementById('big'), type, RES);
      document.getElementById('rtitle').textContent = p.title || '';
      document.getElementById('rdetail').textContent = p.detail || '';
      fillButtons(document.getElementById('btns'), p, 'btns btn-row');
      // 结果到达即聚焦主按钮:键盘用户 Enter 直达,无需先 Tab 到按钮。
      // guard 传 #result:视图已被下一帧切走时放弃聚焦,不抢焦点(原为 style.display 手判)
      K.focusPrimary(document.getElementById('btns'), { delay: 30, guard: document.getElementById('result') });
      return;
    }
    document.getElementById('detail').textContent = p.detail || '';
    const barWrap = document.getElementById('bar');
    barWrap.innerHTML = '';
    barWrap.appendChild(K.progressBar(p, p.title || T('status.progress')));
    const has = typeof p.progress === 'number';
    document.getElementById('pct').textContent = fmtPct(p, has);
    document.getElementById('size').textContent = p.size || '';
  }

  /* -------- 多任务列表(任务中心) -------- */
  function taskRow(t) {
    const row = document.createElement('div');
    row.className = 'trow' + (t.done ? ' done' : '');
    row.dataset.taskId = t.id;
    row.setAttribute('role', 'listitem');
    const ico = document.createElement('span');
    ico.className = 'lico' + (t.done ? ' ' + (t.type || 'info') : '');
    ico.setAttribute('aria-hidden', 'true');
    ico.innerHTML = t.done ? (RES[t.type || 'info'] || RES.info) : (ACT[t.mode] || ACT.check);
    const body = document.createElement('div');
    body.className = 'lbody';
    const title = document.createElement('div');
    title.className = 'ltitle';
    title.textContent = t.title || '';
    body.appendChild(title);
    if (t.detail) {
      const det = document.createElement('div');
      det.className = 'ldetail';
      det.textContent = t.detail;
      body.appendChild(det);
    }
    if (!t.done) {
      // 进行中:进度条 + pct/size(与单视图同一套 ui-kit 共享构件)
      body.appendChild(K.progressBar(t, t.title || T('status.progress')));
      const meta = document.createElement('div');
      meta.className = 'meta';
      const pct = document.createElement('span');
      pct.textContent = fmtPct(t, typeof t.progress === 'number');
      const size = document.createElement('span');
      size.textContent = t.size || '';
      meta.append(pct, size);
      body.appendChild(meta);
    } else if ((t.buttons || []).length) {
      body.appendChild(fillButtons(document.createElement('div'), t, 'lbtns'));
    }
    const x = document.createElement('button');
    x.className = 'lx';
    x.title = t.done ? T('status.closeRow') : T('status.cancelRow');
    x.setAttribute('aria-label', (t.done ? T('status.closeRow') : T('status.cancelRow')) + (t.title || ''));
    x.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
    x.addEventListener('click', () => (t.done ? S.dismiss(t.id) : S.cancelOne(t.id)));
    row.append(ico, body, x);
    return row;
  }

  function renderList(tasks) {
    cur = null;
    const act = tasks.filter((t) => !t.done);
    const done = tasks.filter((t) => t.done);
    document.getElementById('activity').style.display = 'none';
    document.getElementById('activity').setAttribute('aria-busy', 'false');
    document.getElementById('result').style.display = 'none';
    const list = document.getElementById('tlist');
    list.style.display = 'flex';
    list.innerHTML = '';
    document.getElementById('ico').innerHTML = ACT.check;
    document.getElementById('title').textContent = act.length ? T('status.titleActive', { n: act.length }) : T('status.title');
    document.getElementById('bgBtn').style.display = act.length ? '' : 'none';
    document.getElementById('xBtn').title = T('status.closeAll');
    document.getElementById('xBtn').setAttribute('aria-label', T('status.closeAll'));
    // 进行中任务置顶;完成项有进行中任务时折叠进历史
    act.forEach((t) => list.appendChild(taskRow(t)));
    if (done.length && act.length) {
      const h = document.createElement('button');
      h.className = 'hist' + (histOpen ? ' open' : '');
      h.setAttribute('aria-expanded', histOpen ? 'true' : 'false');
      h.setAttribute('aria-controls', 'histWrap');
      // 折叠三角用 SVG(原文本 ▶ 字形随字体渲染漂移):aria-expanded 语义不变
      h.innerHTML = '<svg class="tri" viewBox="0 0 8 8" aria-hidden="true"><path d="M2 1l4 3-4 3" fill="none" stroke="currentColor" stroke-width="1.2"/></svg><span>' + T('status.done', { n: done.length }) + '</span>';
      h.addEventListener('click', () => { histOpen = !histOpen; h.classList.toggle('open', histOpen); h.setAttribute('aria-expanded', histOpen ? 'true' : 'false'); toggleHist(); });
      list.appendChild(h);
      const wrap = document.createElement('div');
      wrap.id = 'histWrap';
      wrap.style.display = histOpen ? 'contents' : 'none';
      done.forEach((t) => wrap.appendChild(taskRow(t)));
      list.appendChild(wrap);
    } else {
      done.forEach((t) => list.appendChild(taskRow(t)));
    }
  }
  function toggleHist() {
    const w = document.getElementById('histWrap');
    if (w) w.style.display = histOpen ? 'contents' : 'none';
  }

  function renderTasks(tasks) {
    if (!tasks.length) return; // 主进程随即关窗,忽略空帧
    // 单任务走旧单视图(像素级兼容 186/250 两档),多任务走列表。
    // 阶段 1 X1 起本窗不再兼任 toast 宿主:瞬时提示由独立的通知宿主(toast.html)承载,
    // 因此这里不必再为"孤儿 toast"单开一条列表路径——列表里出现的每一行都是真实任务。
    if (tasks.length === 1) { listMode = false; render(tasks[0]); }
    else { listMode = true; renderList(tasks); S.rendered(); } // 渲染完成回报:主进程按真实内容高度微调窗口(P1-1)
    // 视图切换帧(ST-1):把焦点交给安全默认控件。进度帧 150ms 一次全量重渲染,
    // 必须凭 viewKey 变化判帧,否则焦点被钉死在 bgBtn 上,用户 Tab 不出去
    const viewKey = listMode ? 'list' : (cur && cur.mode === 'result' ? 'result' : 'act');
    if (viewKey !== lastViewKey) {
      lastViewKey = viewKey;
      if (viewKey !== 'result') focusSafeDefault();
    }
  }

  document.getElementById('bgBtn').addEventListener('click', () => S.background());
  // 单任务:活动态 ✕ = 取消并关闭,结果态 ✕ = 仅关闭;多任务列表:✕ = 取消全部未完成任务并关闭
  // (列表关闭不再直接丢弃运行中任务——那会让下载/安装成为不可见且不可取消的孤儿,P0-1)
  document.getElementById('xBtn').addEventListener('click', () => {
    if (listMode) { S.cancelAll(); return; }
    (cur && cur.mode === 'result' ? S.close() : S.cancel());
  });
  // Esc 语义梯度(P1-4):存在进行中任务时 Esc = 挂后台(安全离开,不打断任务);
  // 仅剩结果/历史时 Esc = 关窗。✕ 按钮保持「显式取消」语义——破坏性操作必须是看着 ✕ 的主动行为
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const hasActive = listMode
      ? [...document.querySelectorAll('#tlist .trow:not(.done)')].length > 0
      : !!(cur && cur.mode !== 'result');
    if (hasActive) S.background(); else document.getElementById('xBtn').click();
  });
  S.onTasks(renderTasks);
</script>
</body>
</html>
