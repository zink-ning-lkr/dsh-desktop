<!-- 标题栏收起后顶部中央的下拉把手,鼠标靠近顶部才浮现 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>reveal</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--c-reveal-bg);
    border: 1px solid color-mix(in srgb, var(--c-brand-hi) 30%, transparent);
    border-top: none;
    border-radius: 0 0 14px 14px; /* 深澜:圆角 11→14,加澜光描边更可发现 */
    color: var(--c-brand-hi);     /* 箭头澜光色 */
    cursor: default;
    user-select: none;
    -webkit-app-region: no-drag;
    transition: background .16s ease, color .16s ease;
    animation: dropIn .18s ease;
  }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  body:hover { background: var(--c-reveal-bg-hover); color: var(--c-brand-hi); }
  svg { width: 14px; height: 14px; transition: transform .16s ease; }
  body:hover svg { transform: translateY(1px); }
  /* 主区域 landmark(X4-3)+ 主区域盒:body 仍是 flex 容器与唯一视觉层(背景/圆角/悬停规则
     一字未动),main 是它唯一子项且宽高 100%,盒与 body 内容盒等大 → 像素零变化。 */
  main { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  /* 交互宿主从 body 换成真 <button>(阶段 0 修 X4-2):
     原实现把 role="button" / tabindex="0" / click / keydown 全挂在 <body> 上,语义与可聚焦
     元素错位——body 不是控件,读屏器的表单控件导航与 Enter 激活都落不到它身上,键盘语义
     还得靠一段手写 keydown 补。现改真按钮:原生可聚焦、原生 Enter/Space 激活、原生 button 角色,
     键盘语义不必自建。按钮透明且铺满 main,视觉与命中区完全由 body 承担,故外观不变。
     复位选择器保持 button(特异性 0,0,1),不高于 ui.css 的 :where(button,…):focus-visible
     (0,1,0),否则 all:unset 会把公共焦点环一起清掉。 */
  button {
    all: unset;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    cursor: default;
    -webkit-app-region: no-drag;
  }
  /* S3 首次收起演示:把手自浮出并呼吸 3s(主进程经 tb:handle-hint 切换 .hint)。
     深澜:呼吸从纯 opacity 升级为「澜光描边扩散」——透明度 + 描边/光晕同步脉动,
     新用户第一次收起时更容易发现这个入口。 */
  body.hint { animation: breathe 1.2s ease-in-out 3; }
  @keyframes breathe {
    0%, 100% { opacity: .55; border-color: color-mix(in srgb, var(--c-brand-hi) 18%, transparent); }
    50% { opacity: 1; border-color: color-mix(in srgb, var(--c-brand-hi) 65%, transparent); box-shadow: 0 2px 14px -2px rgba(77, 107, 254, .5); }
  }
  @media (prefers-reduced-motion: reduce) { body, body.hint { animation: none; } }
</style>
</head>
<body>
<main>
  <button id="revealBtn" type="button">
    <svg viewBox="0 0 11 11" aria-hidden="true"><path d="M1.5 4 L5.5 8 L9.5 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
  </button>
</main>
<script>
  // 文案收编 i18n(X-2 漏网):menu.showBar 与本把手语义同源;titlebar-preload 提供 __i18n
  {
    const tip = window.__i18n.t('menu.showBar');
    const btn = document.getElementById('revealBtn');
    btn.title = tip;
    btn.setAttribute('aria-label', tip);
    // Enter/Space 由 <button> 原生处理,不再需要自建 keydown 分支
    btn.addEventListener('click', () => window.__titlebar && window.__titlebar.showTitlebar());
    // 首次收起演示(S3):只切一个类名。把手的显隐始终由主进程的 bounds 决定,
    // 渲染层不持有可见性真相 —— 视图在演示期间本来就已被主进程放大到 96×26
    window.__titlebar?.onHandleHint?.((on) => document.body.classList.toggle('hint', !!on));
  }
</script>
</body>
</html>
