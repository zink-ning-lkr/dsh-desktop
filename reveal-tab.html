<!-- 标题栏收起后顶部中央的下拉把手,鼠标靠近顶部才浮现 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>reveal</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(13, 17, 23, .78);
    border-radius: 0 0 9px 9px;
    color: #9aa0a6;
    cursor: default;
    user-select: none;
    -webkit-app-region: no-drag;
  }
  body:hover { background: rgba(38, 44, 56, .95); color: #c9d1d9; }
  svg { width: 10px; height: 10px; }
</style>
</head>
<body title="显示标题栏">
  <svg viewBox="0 0 11 11"><path d="M1.5 4 L5.5 8 L9.5 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
<script>
  document.body.addEventListener('click', () => window.__titlebar && window.__titlebar.showTitlebar());
</script>
</body>
</html>
