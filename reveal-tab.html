<!-- 标题栏收起后顶部中央的下拉把手,鼠标靠近顶部才浮现 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>reveal</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(13, 17, 23, .78);
    border-radius: 0 0 11px 11px;
    color: var(--c-fg2);
    cursor: default;
    user-select: none;
    -webkit-app-region: no-drag;
    transition: background .16s ease, color .16s ease;
    animation: dropIn .18s ease;
  }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  body:hover { background: rgba(38, 44, 56, .95); color: var(--c-fg1); }
  svg { width: 14px; height: 14px; transition: transform .16s ease; }
  body:hover svg { transform: translateY(1px); }
  @media (prefers-reduced-motion: reduce) { body { animation: none; } }
</style>
</head>
<body title="显示标题栏">
  <svg viewBox="0 0 11 11"><path d="M1.5 4 L5.5 8 L9.5 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
<script>
  document.body.addEventListener('click', () => window.__titlebar && window.__titlebar.showTitlebar());
</script>
</body>
</html>
