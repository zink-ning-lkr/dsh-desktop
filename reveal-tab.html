<!-- 标题栏收起后顶部中央的下拉把手,鼠标靠近顶部才浮现 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>reveal</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--c-reveal-bg);
    border-radius: 0 0 11px 11px;
    color: var(--c-fg2);
    cursor: default;
    user-select: none;
    -webkit-app-region: no-drag;
    transition: background .16s ease, color .16s ease;
    animation: dropIn .18s ease;
  }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  body:hover { background: var(--c-reveal-bg-hover); color: var(--c-fg1); }
  svg { width: 14px; height: 14px; transition: transform .16s ease; }
  body:hover svg { transform: translateY(1px); }
  @media (prefers-reduced-motion: reduce) { body { animation: none; } }
</style>
</head>
<body role="button" aria-label="" tabindex="0">
  <svg viewBox="0 0 11 11" aria-hidden="true"><path d="M1.5 4 L5.5 8 L9.5 4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
<script>
  // 文案收编 i18n(X-2 漏网):menu.showBar 与本把手语义同源;titlebar-preload 提供 __i18n
  {
    const tip = window.__i18n.t('menu.showBar');
    document.body.title = tip;
    document.body.setAttribute('aria-label', tip);
  }
  const show = () => window.__titlebar && window.__titlebar.showTitlebar();
  document.body.addEventListener('click', show);
  // role=button 需自带键盘激活:Enter/Space 与鼠标点击同效
  document.body.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(); }
  });
</script>
</body>
</html>
