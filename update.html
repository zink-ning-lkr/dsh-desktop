<!-- 应用更新:下载进度小窗(由主进程 executeJavaScript 驱动) -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>更新</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #161b22; color: #c9d1d9; font: 13px/1 "Segoe UI", "Microsoft YaHei", sans-serif; user-select: none; }
  .wrap { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .title { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .bar { height: 6px; border-radius: 3px; background: #21262d; overflow: hidden; }
  .fill { height: 100%; width: 0%; border-radius: 3px; background: linear-gradient(90deg, #5B7BFF, #364FC9); transition: width .2s; }
  .fill.busy { width: 100%; transition: none; background-size: 200% 100%; background-image: linear-gradient(90deg, #21262d, #5B7BFF, #364FC9, #21262d); animation: scan 1.3s linear infinite; }
  @keyframes scan { from { background-position: 0% 0; } to { background-position: -200% 0; } }
  .meta { display: flex; justify-content: space-between; color: #8b949e; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title"><img src="assets/whale-white.png" style="width:16px;height:16px" alt=""><span id="title">正在下载新版本…</span></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="meta"><span id="pct">0%</span><span id="size"></span></div>
</div>
<script>
  function setVersion(v) { document.getElementById('title').textContent = '正在下载新版本 v' + v + '…'; }
  function setBusy(text) {
    document.getElementById('title').textContent = text;
    document.getElementById('fill').classList.add('busy');
    document.getElementById('pct').textContent = '请稍候…';
    document.getElementById('size').textContent = '';
  }
  function setProgress(p, mb, total) {
    document.getElementById('fill').style.width = p + '%';
    document.getElementById('pct').textContent = p.toFixed(1) + '%';
    document.getElementById('size').textContent = mb + ' / ' + total + ' MB';
  }
</script>
</body>
</html>
