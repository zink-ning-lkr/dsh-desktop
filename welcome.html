<!-- 首启欢迎页(P1-6):第一触点品牌引导——说明与 dsh 本体共享、选择工作目录、
     「关闭=收托盘」行为事前告知(替代原裸系统目录对话框;取消=退出语义保留) -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title></title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; background: transparent; user-select: none;
    font: var(--font-ui); }
  /* 深澜:全窗品牌渐变 —— 中心澜光蓝 12% → 深海黑;浅色主题自动换晨光(见 ui.css [data-theme] 下覆写) */
  .win { display: flex; flex-direction: column;
    background: radial-gradient(560px 420px at 50% 18%, color-mix(in srgb, var(--c-brand) 16%, transparent), transparent 70%),
      var(--win-bg, var(--c-win-bg)); }
  [data-theme="light"] .win { background: radial-gradient(560px 420px at 50% 18%, color-mix(in srgb, var(--c-brand) 8%, transparent), transparent 70%), var(--win-bg, var(--c-win-bg)); }
  /* 头部走 ui.css 公共 .win-head(拖拽区 + 图标槽 + 标题规格) */
  .win-head { --head-pad: 12px var(--sp-4); }
  /* .hero 仍是 flex:1(窗口被下限撑高时保持垂直居中);内容高度由主进程量 .hero-in 得到 */
  .hero { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    padding: var(--sp-2) calc(var(--sp-5) * 2); text-align: center; }
  .hero-in { display: flex; flex-direction: column; align-items: center; gap: var(--sp-4); }
  /* 深澜:96px 彩色品牌鲸鱼 + 澜光光晕呼吸(替代 72px 白鲸) */
  .hero img { width: 96px; height: 96px; animation: whaleBreathe 2.6s ease-in-out infinite; }
  @keyframes whaleBreathe {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 18px color-mix(in srgb, var(--c-brand) 30%, transparent)); }
    50% { transform: scale(1.04); filter: drop-shadow(0 0 34px color-mix(in srgb, var(--c-brand) 50%, transparent)); }
  }
  .hero h1 { margin: 0; font-family: var(--font-display); font-size: var(--fs-display); font-weight: 650; line-height: var(--lh-display); color: var(--c-fg0); }
  .hero .sub { font-size: var(--fs-body); color: var(--c-fg1); line-height: var(--lh-body); }
  .hero .sub b { color: var(--c-fg0); font-weight: 600; }
  .act { flex: none; display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
    padding: var(--sp-1) calc(var(--sp-5) * 2) var(--sp-5); }
  /* 首启唯一主操作:40px 高(--ctl-h-lg)、全宽,视觉焦点唯一且明确 */
  #wlChoose { width: 100%; min-height: var(--ctl-h-lg); padding: 0 var(--btn-pad-x); font-size: var(--fs-body); }
  .hint { font-size: var(--fs-ctrl); color: var(--c-fg2); line-height: var(--lh-body); text-align: center; }
  .foot { flex: none; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4);
    border-top: 1px solid color-mix(in srgb, var(--c-brand-hi) 18%, transparent); }
  .foot .tray-note { flex: 1; min-width: 0; font-size: var(--fs-micro); color: var(--c-fg2); line-height: var(--lh-micro);
    display: flex; align-items: center; gap: 6px; }
  .foot .tray-note svg { width: 13px; height: 13px; flex: none; color: var(--c-brand-hi); }
  @media (prefers-reduced-motion: reduce) { .hero img { animation: none; } }
</style>
</head>
<body>
<div class="win" role="main">
  <div class="win-head">
    <span class="ico"><img src="assets/deepseek-whale-color.svg" alt=""></span>
    <span class="t">DSH Desktop</span>
  </div>
  <div class="hero">
    <div class="hero-in">
      <img src="assets/deepseek-whale-color.svg" alt="DSH">
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
  </div>
  <div class="act">
    <button class="btn primary" id="wlChoose" type="button"></button>
    <p class="hint" id="wlHint"></p>
  </div>
  <div class="foot">
    <span class="tray-note">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M1.5 14.5h13"/></svg>
      <span id="trayNoteText"></span>
    </span>
    <button class="btn" id="wlQuit" type="button"></button>
  </div>
</div>
<script>
  const W = window.__welcome;
  // 文案表(X-2 第二批);sub 为仓库内受控文案(仅含 <b>/<br>),用 innerHTML
  const T = (k, p) => window.__i18n.t(k, p);
  document.title = T('welcome.title');
  document.getElementById('h1').textContent = T('welcome.heading');
  document.getElementById('sub').innerHTML = T('welcome.subHtml');
  document.getElementById('wlChoose').textContent = T('welcome.choose');
  document.getElementById('wlHint').textContent = T('welcome.hint');
  document.getElementById('trayNoteText').textContent = T('welcome.trayNote');
  document.getElementById('wlQuit').textContent = T('welcome.quit');
  const chooseBtn = document.getElementById('wlChoose');
  chooseBtn.focus(); // 首触点:Enter 直达「选择工作目录」
  chooseBtn.addEventListener('click', () => W.choose());
  document.getElementById('wlQuit').addEventListener('click', () => W.quit());
  // Esc = 退出(与 Alt+F4/取消语义一致);Enter 在焦点按钮上直接激活
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') W.quit(); });
  // 布局稳定后回报一次,由主进程按真实内容高度回填窗口(阶段 3 S2)。
  // 只在本页主动 ping:不在 resize 上回报 —— setContentSize 会触发 resize,挂上去就是自激循环
  W.rendered();
</script>
</body>
</html>
