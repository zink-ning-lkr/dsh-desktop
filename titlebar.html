<!-- 自绘标题栏:拖拽移动窗口、最小化/最大化/关闭/收起按钮、鲸鱼 logo 与工作目录显示 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>titlebar</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<script src="ui-icons.js"></script>
<style>
  :root { --bg: var(--c-bg0); --fg: var(--c-fg2); }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* 画布底层兜底暗色:主题未送达时页面任何像素都不是白 */
  html { background-color: var(--bg); }
  body {
    /* 纯色背景,不再有底部渐隐区:栏高与页面顶边完全对齐(原渐变区不透明,会把页面顶部盖掉一截) */
    background-color: var(--bg);
    color: var(--fg);
    /* 行距取 --lh-ctrl(原 12px/1:栏内文字与采样色背景贴合过紧,且与其他窗口行距体系脱节) */
    font: var(--fs-ctrl)/var(--lh-ctrl) "Segoe UI", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-app-region: drag; /* 整条可拖动移动窗口;双击最大化/还原 */
  }
  /* 主区域 landmark(X4):本窗内容就是这条标题栏。
     行布局原语从 body 原样搬到 main:main 为 body 唯一子元素且 height:100%,
     盒与 body 的内容盒等大(无内外边距/边框),.cap 的 height:100% 仍解析到同一确定高度,
     故像素零变化。-webkit-app-region 留在 body:窗口拖动区仍是整个视口。 */
  main {
    height: 100%;
    display: flex;
    align-items: center;
  }
  button {
    all: unset;
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    transition: background var(--dur-mid) ease, color var(--dur-mid) ease;
  }
  /* 焦点环走 ui.css 公共 :focus-visible(all:unset 清掉默认轮廓后由它补回) */
  #menuBtn { width: 32px; height: 24px; border-radius: var(--radius-s); margin-left: 5px; }
  #menuBtn svg { width: 13px; height: 13px; }
  #menuBtn:hover { background: var(--c-hover); }
  #menuBtn:hover svg { color: var(--c-brand-hi); }
  /* 深澜:菜单展开态 = 品牌渐变底 + 白图标(从灰底升级为「光源点亮」) */
  #menuBtn.active, #menuBtn.active:hover { background: linear-gradient(180deg, var(--c-brand-vio), var(--c-brand)); }
  #menuBtn.active svg { color: #fff; }
  #collapseBtn { width: 34px; }
  #collapseBtn svg { width: 11px; height: 11px; transition: transform var(--dur-mid) ease; }
  #collapseBtn:hover svg { color: var(--c-fg1); transform: translateY(-1px); }
  .title { display: flex; align-items: center; gap: 8px; padding: 0 12px; min-width: 0; }
  .logo {
    width: 18px; height: 18px; flex: none;
    /* 深澜:彩色品牌鲸鱼(assets/deepseek-whale-color.svg,品牌蓝);
       采样浅底时由 JS 换黑版(见 setLogo) */
    opacity: .95;
  }
  .name { white-space: nowrap; opacity: .85; }
  /* 工作目录:由只读文本升级为「点击复制路径」(S1)。
     深澜:前加 folder 图标,hover 变澜光色 + 图标微动。文本必须包 span:
     text-overflow 只对块级盒生效,flex 容器上的匿名文本节点无法截断。 */
  .workspace {
    display: flex; align-items: center; gap: 5px;
    min-width: 0; max-width: 46vw;
    padding: 0; border: none; background: transparent;
    opacity: .72; white-space: nowrap;
    color: inherit; font: inherit; cursor: default;
    transition: opacity var(--dur-fast) ease, color var(--dur-fast) ease;
  }
  .workspace svg { flex: none; width: 12px; height: 12px; transition: transform var(--dur-fast) ease; }
  .workspace span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .workspace:hover { opacity: 1; color: var(--c-brand-hi); }
  .workspace:hover svg { transform: translateX(1px); }
  .workspace[hidden] { display: none; }
  /* ---- 中 · 命令入口(阶段 2) ----
     胶囊按钮:深澜升级为 22px 高 + 澜光描边 + 放大镜澜光色,hover 微上浮 1px。
     发丝线颜色由 --fg 派生(与状态簇同一取法)——采样底色浅深都可见。 */
  .cmdentry {
    gap: 6px; height: 22px; padding: 0 10px; flex: none;
    border: 1px solid color-mix(in srgb, var(--c-brand-hi) 42%, transparent);
    border-radius: var(--radius-pill);
    color: var(--fg); opacity: .92;
    font-size: var(--fs-micro); line-height: 1;
    transition: background var(--dur-fast) ease, opacity var(--dur-fast) ease, transform var(--dur-fast) ease;
  }
  .cmdentry:hover { background: var(--c-hover); opacity: 1; transform: translateY(-1px); }
  .cmdentry:active { background: var(--c-hover-strong); transform: none; }
  .cmdentry[hidden] { display: none; }
  .cmdentry .ceico { display: flex; align-items: center; color: var(--c-brand-hi); }
  .cmdentry .cekbd { padding: 1px 5px; border-radius: var(--radius-ctl); background: color-mix(in srgb, var(--fg) 12%, transparent); opacity: .9; }
  /* 三级断点(方案 §5.1 / §7.2):≥1200px 全称 + 徽标;960–1200px 收为纯图标;
     深澜(v1.0.0):<960 不再整钮隐藏(主窗 minWidth 即 960,原隐藏规则是边框吃宽后的死代码)——图标钮常显,窄窗仍有可视入口,不依赖 Ctrl+K 记忆 */
  @media (max-width: 1199px) { .cmdentry .celbl, .cmdentry .cekbd { display: none; } }
  @media (max-width: 959px) { .cmdentry { padding: 0 8px; } }
  .spacer { flex: 1; }
  /* ---- 状态簇(阶段 1 S1)· 主题边界(X2) ----
     栏内有且只有一处跟随 dsh 页面采样色:body 的背景(--bg)与前景(--fg,由主进程按采样
     底色亮度算好),窗口键与状态簇的默认字形色都取 --fg,浅底/深底都可读。
     hover 底色沿用窗口键同一套 ui.css 令牌(--c-hover 是中性半透明灰,两种底色上都成立),
     于是整条栏只有一套交互色 —— 这正是 X2 要消掉的「同一条栏两套色系」的割裂。
     状态点/徽标是唯一的语义强调色,取 ui.css 的 --c-ok/--c-warn/--c-err/--c-brand。 */
  .cluster {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 100%;
    padding: 0 4px;
    flex: none;
    /* 1px 发丝线把簇与栏底(采样色)分开。颜色由 --fg 派生而非 --c-hairline:
       --c-hairline 走 --c-border,在浅色采样底上会隐形,起不到分隔作用。 */
    box-shadow: inset 1px 0 0 color-mix(in srgb, var(--fg) 22%, transparent);
  }
  .cbtn { position: relative; width: 24px; height: 24px; border-radius: var(--radius-s); color: var(--fg); }
  .cbtn:hover { background: var(--c-hover); }
  .cbtn:active { background: var(--c-hover-strong); }
  .cbtn svg { width: 15px; height: 15px; } /* 与 ui-icons cmdbar 族同规格 */
  .cbtn[hidden] { display: none; } /* 无内容的状态钮整钮隐藏,不留空位(见 S1) */
  /* 服务点:与按钮同尺寸的盒,但不可交互、无 hover 底(它不是按钮) */
  .cstat { position: relative; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  /* 圆点:颜色即状态(默认灰=未判定,启动瞬间才可能短暂出现)。
     深澜:9px 圆点 + 同色 3px 光晕 ring(色弱/远视下第一眼可读);err 态呼吸脉冲(崩溃可察觉) */
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c-fg3); }
  .dot.ok { background: var(--c-ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-ok) 20%, transparent); }
  .dot.boot { background: var(--c-warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-warn) 20%, transparent); }
  .dot.err {
    background: var(--c-err);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-err) 18%, transparent);
    animation: dotErr 1.6s ease-in-out infinite;
  }
  @keyframes dotErr {
    0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-err) 18%, transparent); }
    50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--c-err) 5%, transparent); }
  }
  /* 角标:数字 / 纯圆点两种形态,压在按钮右上角。深澜:品牌渐变底 + 光晕(从纯色升级) */
  .cbtn .sup {
    position: absolute; top: -2px; right: -2px;
    min-width: 15px; height: 14px; padding: 0 3px;
    border-radius: 7px;
    background: linear-gradient(180deg, var(--c-brand-vio), var(--c-brand));
    color: #fff;
    font-size: 10.5px; line-height: 14px; font-weight: 600; text-align: center;
    box-shadow: 0 1px 4px rgba(77, 107, 254, .45);
  }
  .cbtn .sup.dot-only { min-width: 8px; width: 8px; height: 8px; padding: 0; border-radius: 50%; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-brand) 22%, transparent); }
  .cap { display: flex; height: 100%; flex: none; }
  .cap button { width: 44px; }
  .cap button:hover { background: var(--c-hover); }
  .cap svg { width: 11px; height: 11px; transition: transform var(--dur-fast) ease; }
  .cap button:hover svg { transform: scale(1.12); }
  #closeBtn:hover { background: var(--c-close-hover); color: #fff; }
  #closeBtn:hover svg { transform: scale(1.08); }
  @media (prefers-reduced-motion: reduce) { button, .cap svg, .dot.err { transition: none; animation: none; } }
</style>
</head>
<body>
<main>
  <button id="menuBtn" type="button" title="" aria-label="" aria-haspopup="menu" aria-expanded="false">
    <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <line x1="2" y1="3.5" x2="12" y2="3.5"/><line x1="2" y1="7" x2="12" y2="7"/><line x1="2" y1="10.5" x2="12" y2="10.5"/>
    </svg>
  </button>
  <div class="title">
    <img class="logo" src="assets/deepseek-whale-color.svg" alt="DSH"><span class="name">DSH</span>
    <!-- 工作目录:点击复制完整路径(S1)。深澜:folder 图标 + 文本(文本包 span 以便截断) -->
    <button class="workspace" id="workspace" type="button" hidden>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.5c0-.8.7-1.5 1.5-1.5h2.4L7.3 4h4.2c.8 0 1.5.7 1.5 1.5V6H2v-1.5z"/><path d="M2 6h12v5.5c0 .8-.7 1.5-1.5 1.5h-9C2.7 13 2 12.3 2 11.5V6z"/></svg>
      <span id="wsTxt"></span>
    </button>
  </div>
  <!-- 中 · 命令入口(阶段 2):胶囊按钮 + Ctrl+K 徽标。两个 .spacer 把入口夹在标识区与状态簇之间,
       使其落在二者中间——面板也从命令栏中段向下展开,点击位置与面板位置对齐。
       徽标文案来自主进程(sc:display → shortcuts.display),渲染层不判断平台。 -->
  <div class="spacer"></div>
  <button class="cmdentry" id="cmdBtn" type="button">
    <span class="ceico" id="cmdIco" aria-hidden="true"></span>
    <span class="celbl" id="cmdLbl"></span>
    <span class="cekbd" id="cmdKbd" aria-hidden="true"></span>
  </button>
  <div class="spacer"></div>
  <!-- 右 · 状态簇(阶段 1 S1):服务点 / 任务徽标 / 更新徽标 / 主题。
       徽标与更新钮在无内容时整钮隐藏,避免恒定噪音;图标由 ui-icons.js 注入(command-bar 族)。 -->
  <div class="cluster" id="cluster" role="group">
    <!-- 服务点:纯状态指示,不做成按钮 —— 它没有可执行动作,做成按钮只会多一个无名的 Tab 停靠点。
         role="status" 让状态变化被读屏播报(播报的是短状态词,不含百分比,不会刷屏);
         悬停提示走 title,内容与托盘 tooltip 同源(含运行时长与工作目录)。 -->
    <span class="cstat" id="svcStat" role="status" title=""><span class="dot" id="svcDot"></span><span class="sr-only" id="svcText"></span></span>
    <button class="cbtn" id="taskBtn" type="button" hidden><span class="sup" id="taskN" aria-hidden="true"></span></button>
    <button class="cbtn" id="updBtn" type="button" hidden><span class="sup dot-only" aria-hidden="true"></span></button>
    <button class="cbtn" id="themeBtn" type="button"></button>
  </div>
  <div class="cap">
    <button id="collapseBtn" type="button" title="" aria-label="">
      <svg viewBox="0 0 11 11"><path d="M1.5 7.5 L5.5 3.5 L9.5 7.5" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
    </button>
    <button id="minBtn" type="button" title="" aria-label="">
      <svg viewBox="0 0 11 11"><line x1="1" y1="9.5" x2="10" y2="9.5" stroke="currentColor" stroke-width="1"/></svg>
    </button>
    <button id="maxBtn" type="button" title="" aria-label="">
      <svg id="icoMax" viewBox="0 0 11 11"><rect x="1" y="1" width="9" height="9" fill="none" stroke="currentColor"/></svg>
      <svg id="icoRestore" viewBox="0 0 11 11" style="display:none"><rect x="0.5" y="2.5" width="8" height="8" fill="none" stroke="currentColor"/><path d="M2.5 2.5 V0.5 H10.5 V8.5 H8.5" fill="none" stroke="currentColor"/></svg>
    </button>
    <button id="closeBtn" type="button" title="" aria-label="">
      <svg viewBox="0 0 11 11"><path d="M1 1 L10 10 M10 1 L1 10" stroke="currentColor" stroke-width="1.1"/></svg>
    </button>
  </div>
</main>
<script>
  const t = window.__titlebar;
  const $ = (id) => document.getElementById(id);
  // 文案表(X-2 第二批):preload 已同步拉取,直接填充。T 提到顶层供状态簇复用。
  const T = (k, p) => window.__i18n.t(k, p);
  const setTip = (id, text) => {
    const el = $(id);
    el.title = text;
    el.setAttribute('aria-label', text);
  };
  setTip('menuBtn', T('titlebar.menu'));
  setTip('collapseBtn', T('menu.hideBar'));
  setTip('minBtn', T('titlebar.minimize'));
  setTip('maxBtn', T('titlebar.maximize'));
  setTip('closeBtn', T('common.close'));
  // 主题钮自首帧起就可见(不像任务/更新徽标默认 hidden),但它的名字此前只在第一次
  // tb:status 到达时才写入 —— 在那之前它是 Tab 序里一个没有名字的按钮(X-5)。
  // 先给一个与 auto 模式一致的初始名,后续推送按当前模式覆盖。
  setTip('themeBtn', T('menu.appearance', { mode: T('menu.appearanceAuto') }));
  // 中段命令入口(阶段 2):图标走 palette 域(与面板输入行同一个放大镜),
  // 标签/徽标/提示全部来自文案表与主进程下发的平台前缀
  $('cmdIco').innerHTML = window.UI_ICONS.palette.search;
  $('cmdLbl').textContent = T('palette.open');
  $('cmdKbd').textContent = t.paletteKbd || '';
  $('cmdKbd').hidden = !t.paletteKbd;
  setTip('cmdBtn', [T('palette.open'), t.paletteKbd].filter(Boolean).join(' '));
  $('cmdBtn').onclick = () => t.openPalette();
  // aria-keyshortcuts 用 ARIA 的英文键名写法(Control+K / Meta+K),与界面显示的徽标各司其职:
  // 前者给读屏器,后者给人看
  if (t.paletteKbd) $('cmdBtn').setAttribute('aria-keyshortcuts', t.paletteKbd.replace('Ctrl', 'Control').replace('Cmd', 'Meta'));

  /* ---- 状态簇(阶段 1 S1)----
     服务点 / 任务徽标 / 更新徽标 / 主题。四项全部由主进程 tb:status 整体推送,
     渲染层不做增量合并(载荷 5 个字段,整推更容易与主进程保持一致)。
     图标走 ui-icons.js 的 cmdbar 族经 insertAdjacentHTML 注入:必须用 afterbegin,
     因为角标是静态子节点,innerHTML= 会把角标一起冲掉。 */
  const ICONS = window.UI_ICONS.cmdbar;
  [['taskBtn', ICONS.tasks], ['updBtn', ICONS.update], ['themeBtn', ICONS.theme]]
    .forEach(([id, svg]) => $(id).insertAdjacentHTML('afterbegin', svg));
  $('cluster').setAttribute('aria-label', T('cmdbar.groupLabel'));
  // 模式值 → 文案键:复用主菜单「外观」的同一组键,命令栏与菜单不会各写一份措辞
  const THEME_KEY = { auto: 'menu.appearanceAuto', dark: 'menu.appearanceDark', light: 'menu.appearanceLight' };
  const SVC_KEY = { ok: 'tray.running', boot: 'tray.booting', err: 'tray.stopped' };
  const svcStat = $('svcStat');
  const svcDot = $('svcDot');
  const svcText = $('svcText');
  const taskBtn = $('taskBtn');
  const taskN = $('taskN');
  const updBtn = $('updBtn');

  t.onStatus((st) => {
    // 服务点:颜色即状态。两处文案用途不同,不能混用一份:
    //   title    —— 悬停提示,用主进程给的完整文本(含运行时长与工作目录,与托盘 tooltip 同源)
    //   svcText  —— role="status" 的播报文本,只用短状态词;若播报完整文本,下载期间会以
    //               1% 的粒度反复打断读屏
    svcDot.className = 'dot ' + (st.svc === 'ok' || st.svc === 'boot' ? st.svc : 'err');
    svcStat.title = st.svcText || T('tray.stopped');
    svcText.textContent = T(SVC_KEY[st.svc] || 'tray.stopped');
    // 任务徽标:0 项时整钮隐藏,不制造恒定噪音;数字同步进 aria-label(角标自身 aria-hidden)
    if (st.tasks > 0) {
      taskBtn.hidden = false;
      taskN.textContent = st.tasks > 99 ? '99+' : String(st.tasks);
      setTip('taskBtn', T('cmdbar.tasks', { n: st.tasks }));
    } else {
      taskBtn.hidden = true;
    }
    // 更新徽标:仅在有待处理新版本时出现
    updBtn.hidden = !st.update;
    if (st.update) setTip('updBtn', T('cmdbar.update'));
    // 主题钮:提示带当前模式
    setTip('themeBtn', T('menu.appearance', { mode: T(THEME_KEY[st.themeMode] || 'menu.appearanceAuto') }));
  });
  // 三个可交互状态钮各转发主进程的同名实现(菜单条目 / 既有函数),渲染层不复制语义
  taskBtn.onclick = () => t.openTasks();
  updBtn.onclick = () => t.checkUpdate();
  $('themeBtn').onclick = () => t.cycleTheme();
  $('workspace').onclick = () => t.copyWorkspace();

  // 鲸鱼 logo:标题栏底色跟 dsh 页面采样色(而非主题),logo 也随之切换:
  // 深底用彩色品牌鲸鱼(deepseek-whale-color.svg),浅底换黑版(否则浅色页面上蓝鲸对比不足)。
  // 采样到达前(加载页阶段)底色是令牌色,跟随 data-theme。
  const logo = document.querySelector('.logo');
  let sampled = false; // 已收到页面采样:此后 logo 完全由采样亮度决定,不再跟随主题属性
  const setLogo = (light) => { logo.src = 'assets/' + (light ? 'whale-black.png' : 'deepseek-whale-color.svg'); };
  setLogo(document.documentElement.hasAttribute('data-theme'));
  // 主题属性变化观察:采样到达前的兜底。disconnect 挂在卸载时(X-7):reload 后观察者不残留
  const themeObs = new MutationObserver(() => { if (!sampled) setLogo(document.documentElement.hasAttribute('data-theme')); });
  themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  window.addEventListener('beforeunload', () => themeObs.disconnect());
  $('menuBtn').onclick = () => t.openMenu();
  $('minBtn').onclick = () => t.minimize();
  $('maxBtn').onclick = () => t.toggleMaximize();
  $('closeBtn').onclick = () => t.close();
  $('collapseBtn').onclick = () => t.hideTitlebar();
  t.onTheme(({ bg, fg, light }) => {
    // 跟随 dsh 页面背景色:纯色栏底与页面顶边相接,同色下无缝。
    // 注意:这里只改 body 的底色与默认前景 —— 状态簇的语义强调色与 hover 用的是 ui.css 令牌,
    // 不受采样影响(阶段 1 X2:栏内只有"底色/字形色"跟随页面,"交互色"统一走令牌)。
    sampled = true;
    document.body.style.backgroundColor = bg;
    document.body.style.color = fg;
    setLogo(light);
  });
  t.onMenuState((open) => {
    const el = $('menuBtn');
    if (el) {
      el.classList.toggle('active', !!open);
      el.setAttribute('aria-expanded', String(!!open)); // haspopup 配套:读屏播报展开/折叠(MENU-2)
    }
  });
  t.onMaximized((max) => {
    $('icoMax').style.display = max ? 'none' : '';
    $('icoRestore').style.display = max ? '' : 'none';
    setTip('maxBtn', max ? T('titlebar.restore') : T('titlebar.maximize'));
  });
  t.onWorkspace((ws) => {
    const el = $('workspace');
    const txt = $('wsTxt');
    txt.textContent = ws ? ws : '';
    // 无工作目录时整钮隐藏:空按钮仍会被 Tab 命中,是个没有名字的焦点停靠点
    el.hidden = !ws;
    if (ws) { setTip('workspace', T('cmdbar.copyWs')); }
  });
  // 关闭按钮语义随设置联动:「最小化到托盘」提示用户窗口并未退出(否则点 ✕ 后窗口消失易误以为退出了)
  t.onCloseTip((tip) => { if (tip) setTip('closeBtn', tip); });
</script>
</body>
</html>
