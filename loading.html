<!-- dsh 启动期间的深色加载页:阶段提示 + 实时日志尾巴 + 现代化动效 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>DSH</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    /* 深澜:全屏品牌渐变(中心澜光 → 深海黑)+ 底部海平线;浅色主题自动换晨光 */
    background:
      radial-gradient(720px 420px at 50% 30%, color-mix(in srgb, var(--c-brand) 15%, transparent), transparent 70%),
      linear-gradient(180deg, color-mix(in srgb, var(--c-brand) 7%, transparent), transparent 40%),
      var(--c-bg0);
    color: var(--c-fg2);
    font: var(--font-ui);
    user-select: none;
    overflow: hidden;
  }
  /* 主区域 landmark(X4):启动内容是本窗唯一主区域,此前全页无 landmark,读屏器无法按区域跳转。
     布局原语从 body 原样搬到 main —— main 的盒与 body 的内容盒等大(height:100%、无内外边距、
     无边框),故像素零变化;.logtail / .slow 均为 position:absolute 且无定位祖先,包含块仍是视口,
     不受这层静态包裹影响。 */
  main {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  /* 深澜:72px 彩色品牌鲸鱼 + 澜光光晕呼吸 */
  .logo {
    width: 72px; height: 72px;
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px color-mix(in srgb, var(--c-brand) 32%, transparent)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 24px color-mix(in srgb, var(--c-brand) 55%, transparent)); }
  }
  .ring {
    position: relative; width: 40px; height: 40px;
  }
  .ring::before, .ring::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 3px solid transparent;
  }
  .ring::before {
    border-top-color: var(--c-brand); border-right-color: color-mix(in srgb, var(--c-brand) 35%, transparent);
    animation: spin .85s linear infinite;
  }
  .ring::after {
    inset: -9px; border: 1.5px solid color-mix(in srgb, var(--c-brand) 16%, transparent);
    animation: spin 2.4s linear infinite reverse;
    opacity: .6;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stage { margin: 0; font-size: var(--fs-body); line-height: var(--lh-title); color: var(--c-fg1); min-height: 20px; animation: fadeUp .3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .dots { display: flex; gap: 7px; height: 6px; }
  /* 深澜:已完成光点 = 澜光实心 + 光晕 + 微脉冲(替代灰底) */
  .dots i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--c-bg2);
    transition: background .3s, transform .3s, box-shadow .3s;
  }
  .dots i.on {
    background: var(--c-brand-hi);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-brand) 24%, transparent);
    transform: scale(1.15);
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  /* 深澜:logtail 升级为玻璃条(冷调底 + 澜光 1px 描边 + 圆角) */
  .logtail {
    position: absolute; left: 24px; right: 24px; bottom: 14px;
    font: var(--fs-micro)/var(--lh-micro) "Cascadia Mono", Consolas, monospace;
    color: var(--c-fg2); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: color-mix(in srgb, var(--c-bg1) 78%, transparent);
    border: 1px solid color-mix(in srgb, var(--c-brand-hi) 24%, transparent);
    border-radius: var(--radius-ctl);
    padding: 6px 10px;
  }
  .hint { margin: 0; font-size: var(--fs-ctrl); line-height: var(--lh-ctrl); color: var(--c-fg2); }
  /* 慢启动自助行(P0-2):默认隐藏,主进程 15s 未就绪时经 showSlowActions() 亮出 */
  .slow {
    position: absolute; left: 0; right: 0; bottom: 46px;
    display: none; flex-direction: column; align-items: center; gap: var(--sp-3);
    animation: fadeUp .3s ease;
  }
  .slow.show { display: flex; }
  .slow-tip { font-size: var(--fs-ctrl); line-height: var(--lh-ctrl); color: var(--c-warn); }
  .slow-btns { display: flex; gap: 8px; } /* 间距与全局决策按钮行一致(dialog/report/status 同为 8px) */
  @media (prefers-reduced-motion: reduce) { .logo, .ring::before, .ring::after, .dots i, .slow { animation: none; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="assets/deepseek-whale-color.svg" alt="">
  <div class="ring" aria-hidden="true"></div>
  <p class="stage" id="stage" role="status" aria-live="polite"></p>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <p class="hint" id="hint"></p>
  <div class="slow" id="slow" role="group">
    <p class="slow-tip" id="slowTip"></p>
    <div class="slow-btns btn-row">
      <button class="btn" id="btnLog" type="button"></button>
      <button class="btn primary" id="btnRetry" type="button"></button>
      <button class="btn danger-ghost" id="btnQuit" type="button"></button>
    </div>
  </div>
  <div class="logtail" id="logtail"></div>
</main>
<script>
  // 文案表(X-2 第二批):阶段名与主进程 boot 域同源,UITEST 慢启动用例依赖 3 个自助按钮
  const T = (k, p) => window.__i18n.t(k, p);
  document.getElementById('stage').textContent = T('boot.initial');
  document.getElementById('hint').textContent = T('boot.hint');
  document.getElementById('slow').setAttribute('aria-label', T('boot.slowActions'));
  document.getElementById('slowTip').textContent = T('boot.slowTip');
  document.getElementById('btnLog').textContent = T('boot.viewLog');
  document.getElementById('btnRetry').textContent = T('action.retry');
  document.getElementById('btnQuit').textContent = T('boot.quitBtn');
  const stage = document.getElementById('stage');
  // 四个启动阶段,与主进程 setStage(i) 对应:0 定位 dsh → 1 启动服务 → 2 等待就绪 → 3 加载页面
  const STAGES = [T('boot.locate'), T('boot.start'), T('boot.waitReady'), T('boot.loadPage')];
  for (let i = 0; i < STAGES.length; i++) {
    const d = document.createElement('i');
    document.getElementById('dots').appendChild(d);
  }
  function setStage(i, text) {
    stage.textContent = text || (STAGES[i] || STAGES[0]);
    stage.style.animation = 'none';
    void stage.offsetWidth; // 重启动画
    stage.style.animation = '';
    [...document.querySelectorAll('.dots i')].forEach((d, k) => {
      d.classList.toggle('on', k <= i);
    });
    if (i >= 2) document.getElementById('hint').style.display = 'none';
  }
  const tailEl = document.getElementById('logtail');
  function pushLog(line) {
    tailEl.textContent = line || '';
  }
  // 慢启动兜底:主进程 15s 未加载出服务页时调用,亮出自助操作行并聚焦主操作「重试」
  // (键盘 Enter 直达,无需 Tab 搜索;此时页面其余部分无焦点锚点)
  function showSlowActions() {
    document.getElementById('slow').classList.add('show');
    document.getElementById('btnRetry').focus();
  }
  // 动作桥 dshBoot 由 dsh-preload.js 按 file:// 协议条件暴露;远程 dsh 页无此对象
  for (const [btnId, act] of [['btnLog', 'view-log'], ['btnRetry', 'retry'], ['btnQuit', 'quit']]) {
    document.getElementById(btnId).addEventListener('click', () => window.dshBoot?.action(act));
  }
</script>
</body>
</html>
