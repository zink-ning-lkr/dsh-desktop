<!-- dsh 启动期间的深色加载页:阶段提示 + 实时日志尾巴 + 现代化动效 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>DSH</title>
<link rel="stylesheet" href="ui.css">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--c-bg0);
    color: var(--c-fg2);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    user-select: none;
    overflow: hidden;
  }
  .logo {
    width: 56px; height: 56px;
    filter: drop-shadow(0 0 14px rgba(77, 107, 254, .35));
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(77, 107, 254, .28)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(77, 107, 254, .5)); }
  }
  .ring {
    position: relative; width: 40px; height: 40px;
  }
  .ring::before, .ring::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    border: 3px solid transparent;
  }
  .ring::before {
    border-top-color: var(--c-brand); border-right-color: rgba(77, 107, 254, .35);
    animation: spin .85s linear infinite;
  }
  .ring::after {
    inset: -9px; border: 1.5px solid rgba(77, 107, 254, .16);
    animation: spin 2.4s linear infinite reverse;
    opacity: .6;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stage { margin: 0; font-size: 13px; color: var(--c-fg1); min-height: 18px; animation: fadeUp .3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .dots { display: flex; gap: 7px; height: 6px; }
  .dots i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--c-bg2);
    transition: background .3s, transform .3s;
  }
  .dots i.on { background: var(--c-brand); transform: scale(1.15); animation: dotPulse 1.4s ease-in-out infinite; }
  @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  .logtail {
    position: absolute; left: 16px; right: 16px; bottom: 14px;
    font: 11px/1.7 "Cascadia Mono", Consolas, monospace;
    color: var(--c-fg2); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: .8;
  }
  .hint { margin: 0; font-size: 12px; color: var(--c-fg2); }
  /* 慢启动自助行(P0-2):默认隐藏,主进程 15s 未就绪时经 showSlowActions() 亮出 */
  .slow {
    position: absolute; left: 0; right: 0; bottom: 46px;
    display: none; flex-direction: column; align-items: center; gap: 12px;
    animation: fadeUp .3s ease;
  }
  .slow.show { display: flex; }
  .slow-tip { font-size: 12px; color: var(--c-warn); }
  .slow-btns { display: flex; gap: 10px; }
  @media (prefers-reduced-motion: reduce) { .logo, .ring::before, .ring::after, .dots i, .slow { animation: none; } }
</style>
</head>
<body>
  <img class="logo" src="assets/whale-white.png" alt="">
  <div class="ring" aria-hidden="true"></div>
  <p class="stage" id="stage" role="status" aria-live="polite">正在启动…</p>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <p class="hint" id="hint">正在启动 dsh…(首次启动可能需要安装依赖,耗时较长)</p>
  <div class="slow" id="slow" role="group" aria-label="启动较慢时的自助操作">
    <p class="slow-tip">启动耗时比平时长(可能是首次安装依赖或网络较慢)</p>
    <div class="slow-btns">
      <button class="btn" id="btnLog" type="button">查看日志</button>
      <button class="btn primary" id="btnRetry" type="button">重试</button>
      <button class="btn danger-ghost" id="btnQuit" type="button">取消并退出</button>
    </div>
  </div>
  <div class="logtail" id="logtail"></div>
<script>
  const stage = document.getElementById('stage');
  // 四个启动阶段,与主进程 setStage(i) 对应:0 定位 dsh → 1 启动服务 → 2 等待就绪 → 3 加载页面
  const STAGES = ['定位 dsh 本体…', '启动 dsh web 服务…', '等待服务就绪…', '加载页面…'];
  for (let i = 0; i < STAGES.length; i++) {
    const d = document.createElement('i');
    document.getElementById('dots').appendChild(d);
  }
  function setStage(i, text) {
    stage.textContent = text || (STAGES[i] || STAGES[0]);
    stage.style.animation = 'none';
    void stage.offsetWidth; // 重启动画
    stage.style.animation = '';
    [...document.querySelectorAll('.dots i')].forEach((d, k) => {
      d.classList.toggle('on', k <= i);
    });
    if (i >= 2) document.getElementById('hint').style.display = 'none';
  }
  const tailEl = document.getElementById('logtail');
  function pushLog(line) {
    tailEl.textContent = line || '';
  }
  // 慢启动兜底:主进程 15s 未加载出服务页时调用,亮出自助操作行
  function showSlowActions() {
    document.getElementById('slow').classList.add('show');
  }
  // 动作桥 dshBoot 由 dsh-preload.js 按 file:// 协议条件暴露;远程 dsh 页无此对象
  for (const [btnId, act] of [['btnLog', 'view-log'], ['btnRetry', 'retry'], ['btnQuit', 'quit']]) {
    document.getElementById(btnId).addEventListener('click', () => window.dshBoot?.action(act));
  }
</script>
</body>
</html>
