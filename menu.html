<!-- 自绘深色菜单:主菜单与托盘菜单共用渲染器,支持图标/快捷键/勾选项/键盘导航 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>menu</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<script src="ui-icons.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    font: var(--font-ui);
    color: var(--c-fg1);
    user-select: none;
    -webkit-app-region: no-drag;
  }
  .panel {
    position: absolute;
    background: var(--c-panel-bg);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-l);
    box-shadow: var(--c-panel-shadow);
    padding: 10px 6px;
    animation: menuIn .16s cubic-bezier(.2, .9, .3, 1.1);
  }
  @keyframes menuIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 30px;
    padding: 0 10px;
    border-radius: var(--radius-s);
    cursor: default;
    white-space: nowrap;
    transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
    animation: itemIn .18s ease backwards;
    animation-delay: calc(var(--i, 0) * 8ms);
  }
  @keyframes itemIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
  .item:hover, .item.sel { background: var(--c-sel-bg); color: var(--c-sel-fg); }
  .item .ico { width: 16px; height: 16px; flex: none; color: var(--c-fg2); display: flex; align-items: center; justify-content: center; transition: color var(--dur-fast) ease, transform var(--dur-fast) ease; }
  .item:hover .ico, .item.sel .ico { color: var(--c-brand-hi); transform: translateX(1px); }
  .item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .item .accel { color: var(--c-fg2); font-size: 12px; padding-left: 18px; }
  .sep { height: 1px; background: var(--c-bg2); margin: 4px 8px; }
  .item.danger:hover, .item.danger.sel { background: var(--c-danger-bg); }
  .item.off { opacity: .55; }
  @media (prefers-reduced-motion: reduce) { .panel, .item { animation: none; } }
</style>
</head>
<body>
<div class="panel" id="panel" role="menu" aria-label="菜单" tabindex="-1"></div>
<script>
  // 菜单图标走 ui-icons.js 共享层(P1-2):按条目 id 取用,内部白名单、textContent 渲染不变
  const ICONS = window.UI_ICONS.menu;

  const panel = document.getElementById('panel');
  let navRows = []; // 可交互条目的 DOM 行(与 sel 下标一致;禁用行/分隔线不在内)

  function render(items) {
    panel.innerHTML = '';
    navRows = [];
    items.forEach((it, i) => {
      if (it.type === 'sep') {
        const sep = document.createElement('div');
        sep.className = 'sep';
        sep.setAttribute('role', 'separator');
        panel.appendChild(sep);
        return;
      }
      // 只读条目(如托盘菜单首行状态项):不入键盘导航,不可选不可点,降透明度
      if (it.enabled === false) {
        const row = document.createElement('div');
        row.className = 'item off';
        row.setAttribute('role', 'menuitem');
        row.setAttribute('aria-disabled', 'true');
        const ico = document.createElement('span');
        ico.className = 'ico';
        ico.setAttribute('aria-hidden', 'true');
        ico.innerHTML = ICONS[it.id] || '';
        const lbl = document.createElement('span');
        lbl.className = 'lbl';
        lbl.textContent = it.label;
        row.append(ico, lbl);
        panel.appendChild(row);
        return;
      }
      const row = document.createElement('div');
      row.className = 'item' + (it.id === 'quit' ? ' danger' : '');
      row.style.setProperty('--i', navRows.length);
      row.id = 'mi-' + navRows.length;
      // 勾选项(checked 布尔)语义为 menuitemcheckbox,读屏器可报"选中/未选中"
      if (typeof it.checked === 'boolean') {
        row.setAttribute('role', 'menuitemcheckbox');
        row.setAttribute('aria-checked', it.checked ? 'true' : 'false');
      } else {
        row.setAttribute('role', 'menuitem');
      }
      const ico = document.createElement('span');
      ico.className = 'ico';
      ico.setAttribute('aria-hidden', 'true');
      ico.innerHTML = ICONS[it.id] || ''; // 图标来自内部白名单,安全
      const lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = it.label; // 文本一律 textContent:label 中拼接的版本号/路径等不经 HTML 解析
      const accel = document.createElement('span');
      if (it.checked) { accel.className = 'accel'; accel.title = '已启用'; accel.textContent = '✓'; }
      else if (it.accel) { accel.className = 'accel'; accel.textContent = it.accel; }
      accel.setAttribute('aria-hidden', 'true'); // 快捷键文本并入 aria-label,避免读屏器拆读
      row.setAttribute('aria-label', it.label + (it.accel ? ' ' + it.accel : ''));
      row.append(ico, lbl, accel);
      row.addEventListener('click', () => window.__menu.action(it.id));
      row.addEventListener('mouseenter', () => select(navRows.indexOf(row)));
      navRows.push(row);
      panel.appendChild(row);
    });
  }

  let sel = -1;
  function select(n) {
    sel = n;
    navRows.forEach((el, i) => el.classList.toggle('sel', i === sel));
    // aria-activedescendant:焦点留在菜单容器,选中态由后代项播报
    if (sel >= 0 && navRows[sel]) panel.setAttribute('aria-activedescendant', navRows[sel].id);
    else panel.removeAttribute('aria-activedescendant');
  }

  // typeahead:500ms 缓冲内连续击键累计为前缀,从当前选中项之后循环匹配(Win32 菜单惯例)
  let typeBuf = '';
  let typeTimer = 0;
  function typeahead(ch) {
    clearTimeout(typeTimer);
    typeTimer = setTimeout(() => { typeBuf = ''; }, 500);
    typeBuf += ch;
    const n = navRows.length;
    for (let k = 1; k <= n; k++) {
      const idx = (sel + k) % n;
      const lbl = navRows[idx].querySelector('.lbl').textContent;
      if (lbl.toLowerCase().startsWith(typeBuf)) { select(idx); return; }
    }
  }

  document.addEventListener('keydown', (e) => {
    if (!navRows.length) return;
    // Win32 菜单惯例:方向键在首尾循环;未选中时 ↑ 落到最后一项
    if (e.key === 'ArrowDown') { e.preventDefault(); select(sel >= navRows.length - 1 ? 0 : sel + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); select(sel <= 0 ? navRows.length - 1 : sel - 1); }
    else if (e.key === 'Home') { e.preventDefault(); select(0); }
    else if (e.key === 'End') { e.preventDefault(); select(navRows.length - 1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navRows[sel]?.click(); }
    else if (e.key === 'Escape') { e.preventDefault(); window.__menu.close(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) { e.preventDefault(); typeahead(e.key.toLowerCase()); }
  });

  window.__menu.onShow(({ items, w, margin }) => {
    panel.style.width = w + 'px';
    panel.style.left = margin + 'px';
    panel.style.top = margin + 'px';
    render(items);
    select(-1);
    // 焦点必须落在 role=menu 容器(panel, tabindex=-1):aria-activedescendant 仅在焦点
    // 位于携带该属性的元素上时才被读屏器播报(WAI-ARIA APG menu 模式;P0-7)
    panel.focus();
  });
</script>
</body>
</html>
