<!-- 自绘深色菜单:主菜单与托盘菜单共用渲染器,支持分组小标题/图标/快捷键/勾选项/键盘导航 -->
<!-- 主菜单按 commands.js 的 groups 渲染成分组树(v0.7.13):每组的首行是 .sec 小标题,
     条目挂在 role="group" 的容器里(分组名走 aria-label,可见标题对读屏器隐藏)。
     托盘菜单没有分组,同一份渲染器照样吃得下 —— 行类型是数据驱动,不是两套分支。 -->
<!-- 无 landmark 是有意为之(X4-3 豁免):本窗整体就是一个 role="menu" 弹出层,
     menu 自身已是读屏器可直接跳入的容器型角色,再套 <main> 只会造出"主区域里只有一个菜单"
     的误导性结构。同为单控件窗的 dialog.html(role="dialog")同理豁免。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>menu</title>
<link rel="stylesheet" href="ui.css">
<script src="ui-theme.js"></script>
<script src="ui-icons.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body {
    font: var(--font-ui);
    color: var(--c-fg1);
    user-select: none;
    -webkit-app-region: no-drag;
  }
  .panel {
    position: absolute;
    background: var(--c-panel-bg);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-l);
    box-shadow: var(--c-panel-shadow);
    padding: 10px 8px;
    animation: menuIn .16s cubic-bezier(.2, .9, .3, 1.1);
    /* 溢出兜底(v0.7.13):分组小标题让菜单比"纯分隔线版"高 6×24px,矮屏上主进程会把视图
       高度钳到工作区剩余高度,内部滚动由这里承接。屏幕够高时 max-height 大于内容高度,
       不出现滚动条,观感与从前逐像素一致。 */
    max-height: calc(100% - 24px);
    overflow-y: auto;
    overflow-x: hidden;
  }
  @keyframes menuIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
  /* 滚动条「滚动/悬停才显现,静止自动隐藏」(第七轮 R-1):矮屏钳制出的长 thumb 静止时
     完全不可见——「太长」的观感来自存在本身,让它静止时不存在。点亮/熄灭由 JS 的
     .sb-visible 类控制(见下方脚本),过渡走时长令牌。 */
  .panel::-webkit-scrollbar-thumb { background: transparent; }
  .panel.sb-visible::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--c-border) 55%, transparent); }
  .panel.sb-visible::-webkit-scrollbar-thumb:hover { background: var(--c-border-hover); }
  /* 行高 32px(--ctl-h + 2):菜单是纯点击目标,命中区不小于标准按钮;
     .item /.sec /.sep 三种行高与主进程 menuHeight() 的 MENU_ITEM_H / MENU_SEC_H / MENU_SEP_H
     严格对应,改此处必须同步改那里(单改一处只有"菜单最后一项点不到"这一种表现,极难归因) */
  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 32px;
    padding: 0 12px;
    border-radius: var(--radius-s);
    cursor: default;
    white-space: nowrap;
    font-size: var(--fs-body);
    line-height: var(--lh-ctrl);
    transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
    animation: itemIn .18s ease backwards;
    /* 级联步长 5ms、封顶 100ms(H-3):17 项时 85ms 落位完成,打开即用;「逐项落位」风格不变 */
    animation-delay: calc(min(var(--i, 0), 20) * 5ms);
  }
  @keyframes itemIn { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: none; } }
  .item:hover, .item.sel { background: var(--c-sel-bg); color: var(--c-sel-fg); }
  .item .ico { width: 16px; height: 16px; flex: none; color: var(--c-fg2); display: flex; align-items: center; justify-content: center; transition: color var(--dur-fast) ease, transform var(--dur-fast) ease; }
  .item:hover .ico, .item.sel .ico { color: var(--c-brand-hi); transform: translateX(1px); }
  .item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .item .accel { color: var(--c-fg2); font-size: var(--fs-ctrl); line-height: var(--lh-ctrl); padding-left: 18px; }
  .sep { height: 1px; background: var(--c-bg2); margin: 4px 8px; }
  /* 分组小标题(v0.7.13):字面规格直接复用 ui.css 的 .sec-label(11px / 600 / 字距 .06em)。
     行高锁定 24px —— 与 main.js 的 MENU_SEC_H 严格对应,改这里必须同步改那里,否则菜单底部被裁。
     它不进键盘导航:navRows 只收可交互条目,小标题既不进 navRows 也不参与 typeahead。
     深澜:左侧加 3px 品牌渐变竖线(圆头),分组可读性第一眼成立 */
  .sec {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 24px;
    padding: 0 12px;
  }
  .sec::before {
    content: "";
    flex: none; width: 3px; height: 10px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--c-brand-vio), var(--c-brand));
  }
  .sec .sec-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 分组之间的发丝线用 inset 阴影画:不占布局高度,高度公式不必为它多出一个加数 */
  .grp + .grp > .sec { box-shadow: inset 0 1px 0 var(--c-bg2); }
  /* 危险项(退出):hover 红底 + 图标变红 + 左缘 3px 红条(色弱可辨,不再只靠文字颜色) */
  .item.danger { position: relative; }
  .item.danger::before {
    content: ""; position: absolute; left: 0; top: 9px; bottom: 9px;
    width: 3px; border-radius: 2px;
    background: color-mix(in srgb, var(--c-err) 40%, transparent);
  }
  .item.danger:hover, .item.danger.sel { background: var(--c-danger-bg); }
  .item.danger:hover .ico, .item.danger.sel .ico { color: var(--c-err); }
  /* 勾选项 ✓:深澜升级为澜光圆底徽标(替代裸文本字符) */
  .item .accel.chk {
    display: flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; padding: 0;
    border-radius: 50%;
    background: color-mix(in srgb, var(--c-brand-hi) 18%, transparent);
    color: var(--c-brand-hi);
  }
  /* 底部「所有命令…」:hover 用澜光渐变底,与普通条目区分(它是「引向面板」的桥) */
  .item.palette:hover, .item.palette.sel {
    background: linear-gradient(180deg, color-mix(in srgb, var(--c-brand) 18%, transparent), color-mix(in srgb, var(--c-brand-vio) 8%, transparent));
  }
  /* 只读状态行:.72 与标题栏工作目录同一「弱化但达 AA」梯度(原 .55 低于 4.5:1) */
  .item.off { opacity: .72; }
  @media (prefers-reduced-motion: reduce) { .panel, .item { animation: none; } }
</style>
</head>
<body>
<div class="panel" id="panel" role="menu" tabindex="-1"></div>
<script>
  // 文案走 i18n(阶段 0 修 X5):菜单曾硬编码「已启用」,是全仓最后一处渲染层 JS 中文硬编码。
  // menu-preload 已同步拉取快照,T() 语义与 status/titlebar 页一致(表缺失回退 key)。
  const T = (k, p) => window.__i18n.t(k, p);
  // 菜单图标走 ui-icons.js 共享层(P1-2):按条目 id 取用,内部白名单、textContent 渲染不变
  const ICONS = window.UI_ICONS.menu;

  const panel = document.getElementById('panel');
  panel.setAttribute('aria-label', T('menu.ariaLabel')); // 面板名同样入表(原为中文字面量属性)
  let navRows = []; // 可交互条目的 DOM 行(与 sel 下标一致;禁用行/分隔线不在内)

  // 滚动条自动隐藏(R-1):滚动/悬停点亮,静止 1.2s 熄灭。thumb 长条只在交互瞬间存在,
  // 菜单打开时右侧干净——「太长」的观感根除
  let sbHideTimer = null;
  const sbShow = () => {
    panel.classList.add('sb-visible');
    clearTimeout(sbHideTimer);
    sbHideTimer = setTimeout(() => panel.classList.remove('sb-visible'), 1200);
  };
  panel.addEventListener('scroll', sbShow, { passive: true });
  panel.addEventListener('mouseenter', sbShow);
  panel.addEventListener('mouseleave', () => { clearTimeout(sbHideTimer); panel.classList.remove('sb-visible'); });

  function render(items) {
    panel.innerHTML = '';
    navRows = [];
    // 当前挂载点:分组容器(role="group")。遇到 sep 或下一个 sec 时回到 panel。
    // 之所以真用分组容器、而不是只插一行标题 div:role="menu" 的直接子节点里只有
    // menuitem / menuitemcheckbox / group / separator 会被读屏器认下,裸标题 div 只是
    // "菜单里的一段静态文本",分组语义(以及分组名)进不了无障碍树。
    let host = panel;
    items.forEach((it) => {
      if (it.type === 'sec') {
        const grp = document.createElement('div');
        grp.className = 'grp';
        grp.setAttribute('role', 'group');
        grp.setAttribute('aria-label', it.label); // 分组名由此进入无障碍树
        const head = document.createElement('div');
        head.className = 'sec';
        head.setAttribute('aria-hidden', 'true'); // 可见标题对读屏器隐藏:aria-label 已念过,再念一遍是重复
        const txt = document.createElement('span');
        txt.className = 'sec-label';
        txt.textContent = it.label;
        head.appendChild(txt);
        grp.appendChild(head);
        panel.appendChild(grp);
        host = grp;
        return;
      }
      if (it.type === 'sep') {
        const sep = document.createElement('div');
        sep.className = 'sep';
        sep.setAttribute('role', 'separator');
        panel.appendChild(sep);
        host = panel; // 分隔线终止当前分组:紧随其后的条目(如底部「所有命令…」)直接挂在菜单上
        return;
      }
      // 只读条目(如托盘菜单首行状态项):不入键盘导航,不可选不可点,降透明度
      if (it.enabled === false) {
        const row = document.createElement('div');
        row.className = 'item off';
        row.setAttribute('role', 'menuitem');
        row.setAttribute('aria-disabled', 'true');
        const ico = document.createElement('span');
        ico.className = 'ico';
        ico.setAttribute('aria-hidden', 'true');
        ico.innerHTML = ICONS[it.id] || '';
        const lbl = document.createElement('span');
        lbl.className = 'lbl';
        lbl.textContent = it.label;
        row.append(ico, lbl);
        host.appendChild(row);
        return;
      }
      const row = document.createElement('div');
      row.className = 'item' + (it.id === 'quit' ? ' danger' : '') + (it.id === 'open-palette' ? ' palette' : '');
      row.style.setProperty('--i', navRows.length);
      row.id = 'mi-' + navRows.length;
      // 勾选项(checked 布尔)语义为 menuitemcheckbox,读屏器可报"选中/未选中"
      if (typeof it.checked === 'boolean') {
        row.setAttribute('role', 'menuitemcheckbox');
        row.setAttribute('aria-checked', it.checked ? 'true' : 'false');
      } else {
        row.setAttribute('role', 'menuitem');
      }
      const ico = document.createElement('span');
      ico.className = 'ico';
      ico.setAttribute('aria-hidden', 'true');
      ico.innerHTML = ICONS[it.id] || ''; // 图标来自内部白名单,安全
      const lbl = document.createElement('span');
      lbl.className = 'lbl';
      lbl.textContent = it.label; // 文本一律 textContent:label 中拼接的版本号/路径等不经 HTML 解析
      const accel = document.createElement('span');
      if (it.checked) { accel.className = 'accel chk'; accel.title = T('menu.enabled'); accel.innerHTML = '<svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.2l2 2 4-4.4"/></svg>'; }
      else if (it.accel) { accel.className = 'accel'; accel.textContent = it.accel; }
      accel.setAttribute('aria-hidden', 'true'); // 快捷键文本并入 aria-label,避免读屏器拆读
      row.setAttribute('aria-label', it.label + (it.accel ? ' ' + it.accel : ''));
      // aria-keyshortcuts 是快捷键的**程序化**出口(X4-4):visible 文本被 aria-hidden 之后,
      // 只有它能让读屏器的"快捷键"查询列出这一项,而不是逼用户去翻快捷键速查表
      if (it.accel) row.setAttribute('aria-keyshortcuts', it.accel);
      row.append(ico, lbl, accel);
      row.addEventListener('click', () => window.__menu.action(it.id));
      row.addEventListener('mouseenter', () => select(navRows.indexOf(row)));
      navRows.push(row);
      host.appendChild(row);
    });
  }

  let sel = -1;
  function select(n) {
    sel = n;
    navRows.forEach((el, i) => el.classList.toggle('sel', i === sel));
    // aria-activedescendant:焦点留在菜单容器,选中态由后代项播报
    if (sel >= 0 && navRows[sel]) {
      panel.setAttribute('aria-activedescendant', navRows[sel].id);
      // 视图被钳制变矮时(矮屏 + 分组小标题),选中项要自己滚进可视区;
      // 否则键盘导航会走到屏幕外的行上,屏幕上毫无反馈,像"按了没反应"。nearest 不留多余滚动。
      navRows[sel].scrollIntoView({ block: 'nearest' });
    } else panel.removeAttribute('aria-activedescendant');
  }

  // typeahead:500ms 缓冲内连续击键累计为前缀,从当前选中项之后循环匹配(Win32 菜单惯例)
  let typeBuf = '';
  let typeTimer = 0;
  function typeahead(ch) {
    clearTimeout(typeTimer);
    typeTimer = setTimeout(() => { typeBuf = ''; }, 500);
    typeBuf += ch;
    const n = navRows.length;
    for (let k = 1; k <= n; k++) {
      const idx = (sel + k) % n;
      const lbl = navRows[idx].querySelector('.lbl').textContent;
      if (lbl.toLowerCase().startsWith(typeBuf)) { select(idx); return; }
    }
  }

  document.addEventListener('keydown', (e) => {
    if (!navRows.length) return;
    // Win32 菜单惯例:方向键在首尾循环;未选中时 ↑ 落到最后一项
    if (e.key === 'ArrowDown') { e.preventDefault(); select(sel >= navRows.length - 1 ? 0 : sel + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); select(sel <= 0 ? navRows.length - 1 : sel - 1); }
    else if (e.key === 'Home') { e.preventDefault(); select(0); }
    else if (e.key === 'End') { e.preventDefault(); select(navRows.length - 1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navRows[sel]?.click(); }
    else if (e.key === 'Escape') { e.preventDefault(); window.__menu.close(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) { e.preventDefault(); typeahead(e.key.toLowerCase()); }
  });

  window.__menu.onShow(({ items, w, margin }) => {
    // typeahead 复位(X-4):视图每次开合都是新实例,但本变量在窗口存活期内是模块级的 ——
    // 上次菜单在 500ms 缓冲窗内被关掉时,残留的前缀会与这次的击键拼接,跳到非预期条目
    clearTimeout(typeTimer);
    typeBuf = '';
    sel = -1;
    panel.style.width = w + 'px';
    panel.style.left = margin + 'px';
    panel.style.top = margin + 'px';
    render(items);
    select(-1);
    // 焦点必须落在 role=menu 容器(panel, tabindex=-1):aria-activedescendant 仅在焦点
    // 位于携带该属性的元素上时才被读屏器播报(WAI-ARIA APG menu 模式;P0-7)
    panel.focus();
  });
</script>
</body>
</html>
